<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>서재 탐색</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500;700;900&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');

*{margin:0;padding:0;box-sizing:border-box;}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#fff;
  color:#000;
  font-family:"Noto Serif KR",serif;
  overscroll-behavior-x:none;
}

body{cursor:none;}

#cursor{
  position:fixed;width:18px;height:18px;
  border:1px solid rgba(0,0,0,.9);border-radius:50%;
  pointer-events:none;z-index:99999;
  transform:translate(-50%,-50%);
  mix-blend-mode:multiply;
}

#app{position:fixed;inset:0;display:flex;flex-direction:column;}

#topbar{
  position:fixed;top:0;left:0;width:100%;height:64px;
  display:flex;align-items:center;justify-content:flex-end;gap:8px;
  padding:0 14px 0 70px;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(10px);
  z-index:9999;
}

.mode-btn{
  height:38px;padding:0 16px;
  border:1px solid #000;
  background:#fff;
  font-family:"Noto Sans KR",sans-serif;
  font-size:.82rem;
  font-weight:700;
  letter-spacing:.08em;
  cursor:pointer;
  transition:background .14s ease,color .14s ease;
}

.mode-btn:hover{background:#efefef;}

.mode-btn.active{
  background:#d8d8d8;
  color:#000;
}

#refresh-btn{
  width:40px;height:38px;
  border:1px solid #000;
  background:#fff;
  display:flex;align-items:center;justify-content:center;
  font-family:"Noto Sans KR",sans-serif;
  font-size:19px;font-weight:700;
  line-height:1;cursor:pointer;
  transition:background .14s ease,color .14s ease;
}

#refresh-btn:hover{
  background:#d8d8d8;
  color:#000;
}

#home-btn{
  position:fixed;top:12px;left:14px;width:40px;height:40px;
  display:flex;align-items:center;justify-content:center;
  border:1px solid #000;
  background:#fff;
  font-size:18px;
  cursor:pointer;
  z-index:10000;
}

#home-btn:hover{background:#d8d8d8;}

#scroll{
  position:absolute;
  inset:64px 0 0 0;

  display:flex;
  flex-direction:row;

  overflow-x:auto;
  overflow-y:hidden;

  scrollbar-width:none;
  background:#fff;

  overscroll-behavior:none;
  -webkit-overflow-scrolling:touch;

  touch-action:none;
}
#scroll::-webkit-scrollbar{
  display:none;
}

#scroll::-webkit-scrollbar{display:none;}

.item-wrapper{
  position:relative;
  height:100%;
  flex-shrink:0;
  width:49px;
  transition:width .9s cubic-bezier(.16,1,.3,1);
}

.item-wrapper.open{width:849px;}

.item-visual{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  will-change:transform;
  z-index:2;
}

.item-detail{
  position:absolute;
  top:0;
  right:49px;
  width:800px;
  height:100%;
  overflow-y:auto;
  overflow-x:hidden;
  scrollbar-width:none;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  transform:translateX(100%);
  opacity:0;
  visibility:hidden;
  transition:
    transform .9s cubic-bezier(.16,1,.3,1),
    opacity .36s ease,
    visibility 0s linear .9s;
  pointer-events:none;
  z-index:1;
}
.item-detail::-webkit-scrollbar{display:none;}

.item-wrapper.open .item-detail{
  transform:translateX(0);
  opacity:1;
  visibility:visible;
  pointer-events:auto;
  transition:
    transform .9s cubic-bezier(.16,1,.3,1),
    opacity .36s ease,
    visibility 0s;
}

.item-main{
  position:absolute;
  top:0;
  right:0;
  width:49px;
  height:100%;
  background:#fff;
  transform-origin:bottom center;
  will-change:transform;
  z-index:3;
  overflow:hidden;
}

.spine-bg{
  position:absolute;
  top:0;
  right:0;
  width:49px;
  height:100%;
  background:#fff;
  z-index:2;
  pointer-events:none;
}

.hover-zone{
  position:absolute;
  top:0;
  right:0;
  width:154px;
  height:100%;
  z-index:4;
  cursor:pointer;
}
.item-wrapper.open .hover-zone{width:49px;}

.spine-mark{
  position:absolute;
  inset:10px 4px;
  z-index:1;
  pointer-events:none;
  opacity:0;
  overflow:visible;
  transition:opacity .12s ease;
}

.item-main.active-hover .spine-mark,
.item-wrapper.open .spine-mark{opacity:.9;}

.spine-mark svg{
  width:100%;
  height:100%;
  display:block;
  overflow:visible;
}

.spine-mark path,
.spine-mark circle,
.spine-mark ellipse{
  fill:none;
  stroke:#d1d1d1;
  stroke-width:2.2;
  stroke-linecap:round;
  stroke-linejoin:round;
  vector-effect:non-scaling-stroke;
}

.name-col{
  position:relative;
  z-index:2;
  width:49px;height:100%;
  display:flex;justify-content:center;
  align-items:flex-start;
  padding:18px 7px 0 7px;
}

.name-text{
  writing-mode:vertical-rl;
  font-size:34px;
  font-weight:400;
  line-height:.9;
  letter-spacing:.02em;
  transform:translateY(-13px);
}

.meta-col{
  position:absolute;
  bottom:14px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:1px;
  pointer-events:none;
  z-index:3;
}

.meta-text{
  writing-mode:vertical-rl;
  font-family:"Noto Sans KR",sans-serif;
  font-size:.5rem;
  font-weight:700;
  letter-spacing:.03em;
  line-height:.9;
  opacity:0;
  transform:translateY(-3px);
  transition:opacity .06s linear,transform .06s linear;
}

.item-main.active-hover .meta-text,
.item-wrapper.open .meta-text{
  opacity:1;
  transform:translateY(0);
}

.book-spread{
  width:800px;
  height:100%;
  display:flex;
  flex-direction:row;
  background:#fff;
  overflow:hidden;
}

.page-left{
  flex:0 0 430px;
  height:100%;
  overflow:hidden;
  background:#fff;
}

.page-right{
  flex:1;
  height:100%;
  overflow-y:auto;
  overflow-x:hidden;
  scrollbar-width:none;
  background:#fff;
}
.page-right::-webkit-scrollbar{display:none;}

.page-img{
  width:100%;
  height:100%;
  object-fit:cover;
  opacity:0;
  transform:scale(1.03);
  transition:opacity .28s ease,transform .42s cubic-bezier(.22,1,.36,1);
  filter:grayscale(1) contrast(1.12) brightness(.92) saturate(0) sepia(.08);
}
.item-wrapper.open .page-img{
  opacity:.96;
  transform:scale(1);
}

/* 여기부터 펼침면 내부 설명/메타 구조만 수정 */
.page-info{
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  width:100%;
  min-height:100%;
  padding:2px 2px 1px 10px;
  background:#fff;
}

.caption-text{
  writing-mode:horizontal-tb;
  font-family:"Noto Serif KR",serif;
  font-size:1.08rem;
  font-weight:400;
  line-height:1.85;
  letter-spacing:.02em;
  word-break:keep-all;
  width:100%;
  height:auto;
  padding:15px 0 15px 0;
  opacity:0;
  transform:translateY(8px);
  transition:opacity .28s ease .06s,transform .38s cubic-bezier(.22,1,.36,1) .06s;
}

.info-cols{
  display:grid;
  grid-template-columns:72px 1fr;
  column-gap:1px;
  row-gap:7px;
  width:100%;
  height:auto;
}

.info-col{
  display:contents;
}

.info-label{
  writing-mode:horizontal-tb;
  font-family:"Noto Serif KR",serif;
  font-size:1rem;
  font-weight:400;
  letter-spacing:.08em;
  line-height:1;
  margin-bottom:0;
  color:#000000;
  white-space:nowrap;
  opacity:0;
  transform:translateY(8px);
  transition:opacity .28s ease,transform .38s cubic-bezier(.22,1,.36,1);
}

.info-value{
  writing-mode:horizontal-tb;
  font-family:"Noto Serif KR",serif;
  font-size:1rem;
  font-weight:400;
  letter-spacing:.01em;
  line-height:1;
  color:#000;
  word-break:keep-all;
  opacity:0;
  transform:translateY(8px);
  transition:opacity .28s ease,transform .38s cubic-bezier(.22,1,.36,1);
}

.item-wrapper.open .caption-text,
.item-wrapper.open .info-label,
.item-wrapper.open .info-value{
  opacity:1;
  transform:translateY(0);
}
/* 여기까지 수정 */

.typo-box{
  flex:0 0 420px;
  height:100%;
  background:#fff;
  border-left:0px solid #000;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:40px;
}

.typo-text{
  writing-mode:vertical-rl;
  font-family:"Noto Serif KR",serif;
  font-size:3.2rem;
  font-weight:400;
  line-height:1.15;
  letter-spacing:.08em;
  color:#000;
}
</style>
</head>

<body>
<div id="cursor"></div>

<div id="app">
  <div id="topbar">
    <button class="mode-btn active" data-mode="punct">문장부호</button>
    <button class="mode-btn" data-mode="book">책</button>
    <button id="refresh-btn" aria-label="새로고침" title="새로고침">↻</button>
  </div>

  <div id="home-btn">⌂</div>
  <div id="scroll"></div>
</div>

<script>
const SPREADSHEET_ID = "1lgA52QAg3-tIM07LVgSJVRmOwjbXmUeWfJ1xou-IE2Y";
const GID = "2070526780";
const CSV_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/export?format=csv&gid=${GID}`;

const K = {
  name:"이름",
  cat:"분류",
  period:"시대",
  paper:"종이",
  size:"크기",
  coll:"소장처",
  caption:"caption",
  punctImg:"UL-Punctuation",
  bookImg:"UL-Images"
};

let currentMode = "punct";
const FONT_SIZE = 34;

let allRows = [];
let allWrappers = [];
let openIdx = -1;
const bookMotion = [];

let mouseX = innerWidth / 2;
let mouseY = innerHeight / 2;
let smoothMouseX = mouseX;
let smoothMouseY = mouseY;
let prevSmoothMouseX = smoothMouseX;

let swipeDir = 1;
let hoveredIndex = -1;

const SNAP = 0.05;

function shuffleArray(arr){
  const a = [...arr];
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function parseCSV(t){
  const ln = t.trim().split("\n");
  const hd = splitCSV(ln[0]);

  return ln.slice(1).map(l=>{
    const v = splitCSV(l);
    const o = {};
    hd.forEach((h,i)=>{
      o[h.trim()] = (v[i] || "").trim();
    });
    return o;
  });
}

function splitCSV(l){
  const r = [];
  let c = "";
  let q = false;

  for(const ch of l){
    if(ch === '"') q = !q;
    else if(ch === "," && !q){
      r.push(c);
      c = "";
    } else {
      c += ch;
    }
  }

  r.push(c);
  return r;
}

function getCurrentImage(row){
  return currentMode === "book"
    ? (row[K.bookImg] || row[K.punctImg] || "")
    : (row[K.punctImg] || "");
}

function getSpineMarkType(row){
  const cat = row[K.cat] || "";

  if(cat.includes("괄호")) return "paren";
  if(cat.includes("권표")) return "circle";
  if(cat.includes("구두")) return "comma";

  return "";
}

function createSpineSVG(type){
  const wrap = document.createElement("div");
  wrap.className = `spine-mark mark-${type}`;

  if(!type) return wrap;

  const svgNS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(svgNS, "svg");
  svg.setAttribute("viewBox", "0 0 54 720");
  svg.setAttribute("preserveAspectRatio", "none");
  svg.setAttribute("aria-hidden", "true");

  if(type === "paren"){
    const left = document.createElementNS(svgNS, "path");
    left.setAttribute("d", "M34 70 C18 170 18 550 34 650");

    const right = document.createElementNS(svgNS, "path");
    right.setAttribute("d", "M20 70 C36 170 36 550 20 650");

    svg.appendChild(left);
    svg.appendChild(right);
  }

  if(type === "circle"){
    const ellipse = document.createElementNS(svgNS, "ellipse");
    ellipse.setAttribute("cx", "27");
    ellipse.setAttribute("cy", "360");
    ellipse.setAttribute("rx", "16");
    ellipse.setAttribute("ry", "275");

    svg.appendChild(ellipse);
  }

  if(type === "comma"){
    const fit = document.createElementNS(svgNS, "g");
    fit.setAttribute("transform","translate(-2.87 0) scale(0.5846)");

    const fitted = document.createElementNS(svgNS, "g");
    fitted.setAttribute("transform","translate(27 360) scale(0.72) rotate(-90) translate(-27 -360)");

    const flip = document.createElementNS(svgNS, "g");
    flip.setAttribute("transform","translate(54,0) scale(-1,1)");

    const rotate = document.createElementNS(svgNS, "g");
    rotate.setAttribute("transform","rotate(142 27 360)");

    const comma = document.createElementNS(svgNS, "path");
    comma.setAttribute("d","M27 250 C12 250 10 285 24 305 C34 320 42 350 31 390 C48 365 52 325 45 290 C41 265 35 250 27 250 Z");

    rotate.appendChild(comma);
    flip.appendChild(rotate);
    fitted.appendChild(flip);
    fit.appendChild(fitted);
    svg.appendChild(fit);
  }

  wrap.appendChild(svg);
  return wrap;
}

function buildList(rows){
  allRows = shuffleArray(rows.filter(r=>r[K.name]));

  const scroll = document.getElementById("scroll");
  scroll.innerHTML = "";

  allWrappers = [];
  bookMotion.length = 0;
  openIdx = -1;
  hoveredIndex = -1;

  allRows.forEach((row,idx)=>{
    const wrapper = document.createElement("div");
    wrapper.className = "item-wrapper";

    const visual = document.createElement("div");
    visual.className = "item-visual";

    const detail = document.createElement("div");
    detail.className = "item-detail";

    const spread = document.createElement("div");
    spread.className = "book-spread";

    const pageL = document.createElement("div");
    pageL.className = "page-left";

    const img = document.createElement("img");
    img.className = "page-img";
    img.dataset.row = idx;
    pageL.appendChild(img);

    const pageR = document.createElement("div");
    pageR.className = "page-right";

    const pageInfo = document.createElement("div");
    pageInfo.className = "page-info";

    const caption = document.createElement("div");
    caption.className = "caption-text";
    caption.textContent = row[K.caption] || "";

    const infoCols = document.createElement("div");
    infoCols.className = "info-cols";

    [
      {key:K.name, label:"이름"},
      {key:K.period,label:"시대"},
      {key:K.cat,  label:"분류"},
      {key:K.coll, label:"소장처"},
      {key:K.paper,label:"종이"},
      {key:K.size, label:"크기"}
    ].filter(f=>row[f.key]).forEach(f=>{
      const col = document.createElement("div");
      col.className = "info-col";

      const lbl = document.createElement("div");
      lbl.className = "info-label";
      lbl.textContent = f.label;

      const val = document.createElement("div");
      val.className = "info-value";
      val.textContent = row[f.key];

      col.appendChild(lbl);
      col.appendChild(val);
      infoCols.appendChild(col);
    });

    pageInfo.appendChild(infoCols);
    pageInfo.appendChild(caption);
    pageR.appendChild(pageInfo);

    spread.appendChild(pageL);
    spread.appendChild(pageR);
    detail.appendChild(spread);

    const main = document.createElement("div");
    main.className = "item-main";

    const spineType = getSpineMarkType(row);
    const spineMark = createSpineSVG(spineType);
    main.appendChild(spineMark);

    const nc = document.createElement("div");
    nc.className = "name-col";

    const nt = document.createElement("span");
    nt.className = "name-text";
    nt.style.fontSize = FONT_SIZE + "px";
    nt.textContent = row[K.name] || "";

    nc.appendChild(nt);
    main.appendChild(nc);

    const mc = document.createElement("div");
    mc.className = "meta-col";

    [row[K.cat], row[K.period], row[K.coll]].filter(Boolean).forEach(v=>{
      const t = document.createElement("span");
      t.className = "meta-text";
      t.textContent = v;
      mc.appendChild(t);
    });

    main.appendChild(mc);

    const bg = document.createElement("div");
    bg.className = "spine-bg";

    const hz = document.createElement("div");
    hz.className = "hover-zone";

    hz.addEventListener("mouseenter",()=>{ hoveredIndex = idx; });
    hz.addEventListener("mouseleave",()=>{ if(hoveredIndex === idx) hoveredIndex = -1; });
    hz.addEventListener("click",()=>{ toggleItem(idx); });

    visual.appendChild(detail);
    visual.appendChild(bg);
    visual.appendChild(main);
    visual.appendChild(hz);

    wrapper.appendChild(visual);
    scroll.appendChild(wrapper);

    allWrappers.push(wrapper);
    bookMotion.push({x:0,r:0,tx:0,tr:0});
  });

  const typoBox = document.createElement("div");
  typoBox.className = "typo-box";

  const typoText = document.createElement("div");
  typoText.className = "typo-text";
  typoText.textContent = "";

  typoBox.appendChild(typoText);
  scroll.appendChild(typoBox);
}

function toggleItem(idx){
  const wrapper = allWrappers[idx];
  const isOpen = wrapper.classList.contains("open");

  if(openIdx >= 0 && openIdx !== idx){
    allWrappers[openIdx].classList.remove("open");

    const oldImg = allWrappers[openIdx].querySelector(".page-img");
    oldImg.style.opacity = 0;

    setTimeout(()=>{ oldImg.src = ""; },900);
  }

  if(isOpen){
    wrapper.classList.remove("open");

    const img = wrapper.querySelector(".page-img");
    img.style.opacity = 0;

    setTimeout(()=>{ img.src = ""; },900);

    openIdx = -1;
  } else {
    wrapper.classList.add("open");

    const img = wrapper.querySelector(".page-img");
    const src = getCurrentImage(allRows[idx]);

    if(src && img.src !== src){
      img.src = src;
      img.onload = ()=>{ img.style.opacity = .96; };
    }

    openIdx = idx;
  }
}

function lerp(a,b,t){return a + (b - a) * t;}
function clamp(v,mn,mx){return Math.max(mn,Math.min(mx,v));}

function updateBookTargets(){
  allWrappers.forEach((w,i)=>{
    w.querySelector(".item-main").classList.remove("active-hover");
    bookMotion[i].tx = 0;
    bookMotion[i].tr = 0;
  });

  if(hoveredIndex < 0) return;

  const hoveredWrapper = allWrappers[hoveredIndex];
  const hoveredMain = hoveredWrapper.querySelector(".item-main");

  hoveredMain.classList.add("active-hover");

  const rect = hoveredMain.getBoundingClientRect();
  const bookH = rect.height;
  const bookW = rect.width;

  const relY = clamp((smoothMouseY - rect.top) / bookH, 0, 1);
  const angleDeg = lerp(18, 6, relY);
  const rotate = -swipeDir * angleDeg;
  const rad = angleDeg * Math.PI / 180;
  const protrude = bookH * Math.sin(rad) + (bookW / 2) * (1 - Math.cos(rad));
  const hoveredIsOpen = hoveredIndex === openIdx;

  allWrappers.forEach((w,i)=>{
    const d = i - hoveredIndex;
    let shift = 0;
    let rot = 0;

    if(d === 0){
      if(!hoveredIsOpen) rot = rotate;
    } else if(!hoveredIsOpen && d > 0){
      if(rotate > 0) shift = protrude;
    } else if(!hoveredIsOpen && d < 0){
      if(rotate < 0) shift = -protrude;
    }

    bookMotion[i].tx = shift;
    bookMotion[i].tr = rot;
  });
}

const cursor = document.getElementById("cursor");
const scrollEl = document.getElementById("scroll");

/* 세로 휠 → 가로 스크롤 */
scrollEl.addEventListener("wheel",e=>{
  e.preventDefault();

  const horizontalAmount =
    Math.abs(e.deltaX) > Math.abs(e.deltaY)
      ? e.deltaX
      : e.deltaY;

  scrollEl.scrollLeft += horizontalAmount * 1.2;
},{
  passive:false
});


/* 모바일/트랙패드 스와이프 */
let touchStartX = 0;
let touchStartY = 0;
let touchStartScrollLeft = 0;

scrollEl.addEventListener("touchstart",e=>{
  if(e.touches.length !== 1) return;

  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
  touchStartScrollLeft = scrollEl.scrollLeft;
},{
  passive:true
});

scrollEl.addEventListener("touchmove",e=>{
  if(e.touches.length !== 1) return;

  const currentX = e.touches[0].clientX;
  const currentY = e.touches[0].clientY;

  const diffX = touchStartX - currentX;
  const diffY = touchStartY - currentY;

  const atLeftEdge = scrollEl.scrollLeft <= 0;
  const swipingRight = diffX < 0;

  /* 브라우저 뒤로가기 방지 */
  if(atLeftEdge && swipingRight){
    e.preventDefault();
    scrollEl.scrollLeft = 0;
    return;
  }

  e.preventDefault();

  /* 가로 이동 */
  if(Math.abs(diffX) >= Math.abs(diffY)){
    scrollEl.scrollLeft = touchStartScrollLeft + diffX;
  }
  /* 세로 제스처도 가로로 변환 */
  else{
    scrollEl.scrollLeft += diffY;
  }

},{
  passive:false
});


/* Safari/iOS 뒤로가기 제스처 차단 강화 */
if(history.scrollRestoration){
  history.scrollRestoration = "manual";
}

history.pushState(null, "", location.href);

window.addEventListener("popstate",()=>{
  history.pushState(null, "", location.href);
});

window.addEventListener("mousemove",e=>{
  mouseX = e.clientX;
  mouseY = e.clientY;
});

scrollEl.addEventListener("scroll",()=>{
  hoveredIndex = -1;

  allWrappers.forEach(w=>{
    w.querySelector(".item-main").classList.remove("active-hover");
  });
},{passive:true});

document.querySelectorAll(".mode-btn").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll(".mode-btn").forEach(b=>{
      b.classList.remove("active");
    });

    btn.classList.add("active");
    currentMode = btn.dataset.mode;

    document.querySelectorAll(".page-img").forEach((img,i)=>{
      if(!allWrappers[i].classList.contains("open")) return;

      img.style.opacity = 0;

      setTimeout(()=>{
        img.src = getCurrentImage(allRows[i]);
        img.onload = ()=>{ img.style.opacity = .96; };
      },120);
    });
  });
});

function animate(){
  prevSmoothMouseX = smoothMouseX;
  smoothMouseX = lerp(smoothMouseX, mouseX, .18);
  smoothMouseY = lerp(smoothMouseY, mouseY, .18);

  const dx = smoothMouseX - prevSmoothMouseX;

  if(Math.abs(dx) > 0.15){
    swipeDir = dx > 0 ? 1 : -1;
  }

  cursor.style.left = smoothMouseX + "px";
  cursor.style.top  = smoothMouseY + "px";

  updateBookTargets();

  allWrappers.forEach((w,i)=>{
    const visual = w.querySelector(".item-visual");
    const main = w.querySelector(".item-main");
    const m = bookMotion[i];

    m.x = lerp(m.x, m.tx, .10);
    m.r = lerp(m.r, m.tr, .08);

    if(Math.abs(m.x - m.tx) < SNAP) m.x = m.tx;
    if(Math.abs(m.r - m.tr) < SNAP) m.r = m.tr;

    visual.style.transform = `translate3d(${m.x}px,0,0)`;
    main.style.transform = `rotateZ(${m.r}deg)`;
  });

  requestAnimationFrame(animate);
}

document.getElementById("home-btn").addEventListener("click",()=>{
  window.location.href = "index.html";
});

document.getElementById("refresh-btn").addEventListener("click",()=>{
  location.reload();
});

fetch(CSV_URL)
  .then(r=>r.text())
  .then(t=>{
    const rows = parseCSV(t);
    buildList(rows);
    animate();
  });
</script>
