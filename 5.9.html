<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>서재 탐색</title>
<style>

  
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500;700;900&family=Noto+Sans+KR:wght@300;400;500;700;900&family=Noto+Serif+JP:wght@400;500;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}

@font-face {
  font-family: 'OnulSamhwamyeongjo';
  src: url('./OnulSamhwamyeongjo-Regular.woff') format('woff');
  font-weight: normal;
  font-style: normal;
}
@font-face {
  font-family: 'SM3Gothic';
  src: url('./SM3Gothic.woff') format('woff');
  font-weight: normal;
  font-style: normal;
}


html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#ffffff;
  color:#000;
  font-family:"Noto Serif KR",serif;
  overscroll-behavior-x:none;
}

body{cursor:none;}

#cursor{
  position:fixed;width:18px;height:18px;
  border:1px solid rgba(0,0,0,.9);border-radius:50%;
  pointer-events:none;z-index:99999;
  transform:translate(-50%,-50%);mix-blend-mode:multiply;
}

#app{position:fixed;inset:0;display:flex;flex-direction:column;}

#topbar{
  position:fixed;
  top:15px;
  left:210px;
  right:0;
  width:auto;
  height:25px;

  display:grid;
  grid-template-columns:minmax(180px, 1fr) auto auto auto auto;
  align-items:center;
  column-gap:16px;

  padding:0 24px 0 10px;
  background:rgba(255, 255, 255, 0.96);
  backdrop-filter:blur(10px);
  z-index:9999;
  border-bottom:1.5px solid #ffffff;
}

#sidebar{
  position:fixed;
  top:0;
  left:0;

  width:210px;
  height:100vh;

  background:#fff;
  border-right:1px solid #888;

  z-index:10001;

  padding:20px;
}

.mode-btn{
  position:static;
  width:auto;
  min-width:max-content;
  height:33px;
  padding:0 20px 0 0;

  appearance:none;
  -webkit-appearance:none;

  border:none;
  border-top:1.5px solid #525252;
  border-bottom:1.5px solid transparent;

  background:transparent;

  font-family:'OnulSamhwamyeongjo', serif;
  font-size:1rem;
  font-weight:500;
  letter-spacing:.06em;
  cursor:pointer;
  transition:background .14s linear,color .14s linear;
}
.mode-btn.active{color: #959595;}

#refresh-btn{
  position:static;
  width:40px;
  height:33px;

  appearance:none;
  -webkit-appearance:none;

  border:none;
  border-top:1.5px solid #595959;
  border-bottom:1.5px solid transparent;

  background:transparent;

  display:flex;
  align-items:center;
  justify-content:center;
  font-family:'OnulSamhwamyeongjo', serif;
  font-size:22px;
  font-weight:200;
  line-height:1;
  cursor:pointer;
  transition:background .14s linear,color .14s linear;
}

#refresh-btn:hover{color: #a2a2a2;}
#sidebar-home:hover{color: #9f9f9f;}
.mode-btn:hover{color: #989898;}


#sidebar-home{
  position:fixed;
  top:15px;
  left:14px;
  width:180px;
  height:30px;

  font-family:'OnulSamhwamyeongjo', serif;
  font-size:1rem;
  font-weight:500;
  letter-spacing:.05em;

  appearance:none;
  -webkit-appearance:none;

  border:none;
  border-top:1.5px solid #595959;
  border-bottom:1.5px solid transparent;


  background:transparent;

  display:flex;
  align-items:center;
  justify-content:flex-start;
  cursor:pointer;
  z-index:10000;
}

#sidebar-punctuation,
#sidebar-library,
#sidebar-info{
  position:fixed;
  left:14px;
  width:180px;
  height:33px;

  font-family:'OnulSamhwamyeongjo', serif;
  font-size:1rem;
  font-weight:500;
  letter-spacing:.05em;

  appearance:none;
  -webkit-appearance:none;

  border:none;
  border-top:1.5px solid #595959;
  border-bottom:1.5px solid transparent;

  background:transparent;

  display:flex;
  align-items:center;
  justify-content:flex-start;

  cursor:pointer;
  z-index:10000;
}

#sidebar-library{
  top:42px;
}

#sidebar-library-menu{
  position:fixed;
  top:75px;
  left:14px;
  width:180px;
  display:none;
  z-index:10000;
}

#sidebar-library-menu.open{
  display:block;
}

.sidebar-sub-btn{
  width:160px;
  height:20px;
  margin:0 0 4px 19px;
  padding-top:5px;

  font-family:'OnulSamhwamyeongjo', serif;
  font-size:1rem;
  font-weight:500;
  letter-spacing:.05em;
  line-height: 0.9;

  appearance:none;
  -webkit-appearance:none;

  border:none;
  border-top:1.5px solid #595959;
  border-bottom:1.5px solid transparent;

  background:transparent;

  display:flex;
  align-items:center;
  justify-content:flex-start;

  cursor:pointer;
}

.sidebar-sub-btn:hover{
  color:#9f9f9f;
}

#sidebar-punctuation{
  top:69px;
}

#sidebar.has-library-menu-open #sidebar-punctuation{
  top:184px;
}

#sidebar-info{
  bottom:15px;
}

#sidebar-library:hover,
#sidebar-punctuation:hover,
#sidebar-info:hover{
  color:#9f9f9f;
}


#print-btn{
  position:static;
  width:auto;
  min-width:60px;
  height:33px;

  appearance:none;
  -webkit-appearance:none;
  border:none;
  border-top:1.5px solid #595959;
  border-bottom:1.5px solid transparent;
  background:transparent;

  font-family:'OnulSamhwamyeongjo', serif;
  font-size:1rem;
  cursor:pointer;
}

#print-btn:hover{
  color:#9f9f9f;
}

#library-btn{
  position:static;
  width:auto;
  height:33px;

  font-family:'OnulSamhwamyeongjo', serif;
  font-size:1rem;
  font-weight:500;
  letter-spacing:.05em;

  appearance:none;
  -webkit-appearance:none;

  border:none;
  border-top:1.5px solid #595959;
  border-bottom:1.5px solid transparent;

  background:transparent;

  display:flex;
  align-items:center;
  justify-content:flex-start;
  cursor:pointer;
  z-index:10000;
}

#library-btn:hover{color: #b0b0b0;}

@media (max-width: 900px){
  #topbar{
    column-gap:10px;
    padding-right:14px;
  }

  .mode-btn{
    padding-right:12px;
  }

  #library-btn,
  .mode-btn,
  #print-btn{
    font-size:.9rem;
  }
}


#scroll{
  position:absolute;
  top:50px;
  left:210px;
  right:0;
  bottom:0;
  display:flex;flex-direction:row;
  overflow-x:auto;overflow-y:hidden;
  scrollbar-width:none;
  background:#dedede;
  overscroll-behavior-x:none;
  touch-action:pan-x;
}
#scroll::-webkit-scrollbar{display:none;}

.item-wrapper{
  position:relative;
  height:100%;
  flex-shrink:0;
  width:49px;
  transition:width .6s linear;
  margin-right:-1px;
}

.item-wrapper.open{width:820px;}

.item-visual{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  will-change:transform;
  z-index:2;
}

.item-detail{
  position:absolute;
  top:0;

  left:49px;
  right:auto;

  width:770px;
  height:100%;
  background:#fff;

  overflow-y:auto;
  overflow-x:hidden;
  scrollbar-width:none;
  padding-bottom:300px; /* 이걸 추가 */
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;

  border-left:1.5px solid #828282;
  border-right:1.5px solid #838383;

  transform:translateX(-49px); /* 중요 */
  opacity:1;
  visibility:hidden;

  transition:
    opacity .5s linear,
    transform .6s linear,
    visibility 0s linear .6s;
}

.item-detail.closing{
  opacity:0;
}

.item-detail::-webkit-scrollbar{display:none;}

.item-wrapper.open .item-detail{
  transform:translateX(0);
  opacity:1;
  visibility:visible;
  pointer-events:auto;
  transition:
    transform .6s linear,
    visibility 0s;
}

.item-main{
  position:absolute;
  top:0;
  left:0;
  right: auto;
  width:50px;
  height:100%;
  background:#fff;
  transform-origin:bottom center;
  will-change:transform;
  z-index:3;
  overflow:hidden;
}

/*.item-main::after {
  content: "";
  position: absolute;
  top: 0;
  left: 0;     
  width: 1.5px;
  height: 100%;
  background: rgb(128, 128, 128);
  z-index: 9999;
}*/

.spine-bg{
  position:absolute;
  top:0;
  left:0;
  right:auto;
  width:49px;
  height:100%;
  background:#dedede;
}

.hover-zone{
  position:absolute;
  top:0;
  left:0;
  right: auto;
  width:154px;
  height:100%;
  z-index:4;
  cursor:pointer;
}
.item-wrapper.open .hover-zone{width:49px;}

.spine-mark{
  position:absolute;
  inset:10px 4px;
  z-index:1;
  pointer-events:none;
  opacity:0;
  overflow:visible;
  transition:none;
}

.item-main.active-hover .spine-mark,
.item-wrapper.open .spine-mark{opacity:.9;}

.spine-mark svg{
  width:100%;
  height:100%;
  display:block;
  overflow:visible;
}

.spine-mark path,
.spine-mark circle,
.spine-mark ellipse{
  fill:none;
  stroke:#00ff6e;
  stroke-width:2.2;
  stroke-linecap:round;
  stroke-linejoin:round;
  vector-effect:non-scaling-stroke;
}

.name-col{
  position:relative;
  z-index:2;
  width:49px;height:100%;
  display:flex;justify-content:center;align-items:flex-start;
  padding:18px 7px 0 7px;
}
.name-text{
  writing-mode:vertical-rl;
  font-size:34px;
  font-weight:400;
  line-height:1.2;
  letter-spacing:.08em;
  font-family:"Noto Serif KR",serif;
}

.jp-comma{
  font-family:"Noto Serif JP",serif;
  font-size:0.92em;
  display:inline-block;
  letter-spacing:-0.7em;
}

.item-main.active-hover .meta-text,
.item-wrapper.open .meta-text{opacity:1;transform:translateY(0);}

.book-spread{
  width:770px;
  min-height:100%;
  height:auto;
  display:flex;
  flex-direction:column;
  background:#fff;
  font-family:'SM3Gothic', sans-serif;
}

.page-left{
  width:100%;
  min-height:100%;
  height:auto;
  overflow:visible;
  background:#ffffff;
  flex-shrink:0;

  display:grid;
  grid-template-columns:150px 1fr;
  gap:24px;
  align-items:start;
  padding:28px 28px 300px 28px;
}

/* 이미지 왼쪽 info */
.info-cols{
  width:150px;
  height:100%;              /* 추가 */
  display:flex;
  flex-direction:column;
  gap:9px;
  position:relative;
}

.info-col{
  display:grid;
  grid-template-columns:42px 1fr;
  gap:10px;
  align-items:start;
  opacity:0;
  transform:none;
  transition:opacity .5s linear;
}

.item-wrapper.open .info-col,
.item-wrapper.open .image-description-wrap,
.item-wrapper.open .image-description,
.item-wrapper.open .page-img,
.item-wrapper.open .info-cols::before,
.item-wrapper.open .spread-nav,
.item-wrapper.open .image-description-en{
  opacity:1;
  transform:none;
  transition:
    opacity .5s linear .8s;
}

.item-wrapper:not(.open) .info-col,
.item-wrapper:not(.open) .image-description-wrap,
.item-wrapper:not(.open) .image-description,
.item-wrapper:not(.open) .page-img,
.item-wrapper:not(.open) .info-cols::before,
.item-wrapper:not(.open) .spread-nav,
.item-wrapper:not(.open) .image-description-en{
  
  opacity:0;
  transform:none;
  transition:
    opacity .2s linear 0s;
}

.item-detail.closing .info-col,
.item-detail.closing .image-description-wrap,
.item-detail.closing .image-description,
.item-detail.closing .page-img,
.item-detail.closing .info-cols::before,
.item-detail.closing .spread-nav,
.item-detail.closing .image-description-en{
  opacity:0;
  transition:
    opacity .2s linear 0s;
}

.info-label,
.info-value{
  writing-mode:horizontal-tb;
  text-orientation:mixed;
  font-family:'SM3Gothic', sans-serif;
  font-size:.8rem;
  font-weight:300;
  line-height:1.6;
  margin:0;
  padding:0;
  letter-spacing:.0em;
  white-space:normal;
  overflow-wrap:anywhere;
  word-break:break-all;
  hyphens:auto;
}

.info-label{
  color:#000;
  transform:translateX(-6px);
}

.info-value{
  color:#000;
}

.image-area{
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:18px;
}

.page-img{
  width:480px;
  height:400px;

  object-fit:cover;

  box-sizing:border-box;

  opacity:1;
  transition:transform .42s cubic-bezier(.22,1,.36,1);
  filter:grayscale(1) contrast(1.12) brightness(.92) saturate(0) sepia(.08);
}

.item-wrapper.open .page-img{
  opacity:.96;
  transform:scale(1);
}

/* 이미지 아래 설명: 한글 → 영어 순서 */
.image-description-wrap{
  position:absolute;
  left:-5px;
  top:450px;
  width:720px;
  line-height:2;
  letter-spacing: 1.2;
  border-top:1.5px solid #000000; 
  border-bottom:1.5px solid #767676;  /* 위쪽 선 */
  padding-top:4px;     
  padding-bottom:6px;      

  display:grid;
  grid-template-columns:340px 340px;
  gap:40px;
  align-items:start;

  cursor:pointer;
}

.image-description-wrap:hover::before{
  color:#a9a9a9;
}

.image-description-wrap.saved::before{
  content:"내 서재에 추가됨";
}

.image-description-wrap::before{
  content:"내 서재에 추가";
  font-size: 0.9rem;


  position:absolute;
  left:0;
  bottom:100%;

  width:720px;
  height:20px;
  transform:translateY(-8px);

  border-top:1.5px solid #000000;
}


.image-description,
.image-description-en{
  color:#000;
  width:340px;
  max-width:340px;
  word-break:keep-all;
  overflow-wrap:break-word;
  opacity:0;
  transform:none;
  transition:opacity .5s linear;
}

.image-description{
  font-family:'SM3Gothic', sans-serif;
  font-size:0.9rem;
  line-height:2.0;
  letter-spacing:0.0em;
}

.image-description-en{
  font-family:"Helvetica Neue", Arial, sans-serif;
  font-size:1rem;
  line-height:1.6;
  letter-spacing:0.03em;
}

.spread-nav{
  position:absolute;
  left:-5px;
  top:965px;
  width:720px;

  display:flex;
  justify-content:space-between;

  opacity:0;
  transition:opacity .5s linear;
}

.item-wrapper.open .spread-nav{
  opacity:1;
  transition:opacity .5s linear .8s;
}

.nav-box{
  width:1000px;
  height:30px;
  background:#fff;

  font-family:'SM3Gothic', sans-serif;
  font-size:0.85rem;

  cursor:pointer;
}

.nav-box.next{
  text-align:right;
}

.nav-box:hover{
  color:#a9a9a9;
}

#content-frame{
  position:fixed;
  left:210px;
  top:50px;
  width:calc(100vw - 210px);
  height:calc(100vh - 50px);
  border:none;
  background:white;
  display:none;
  z-index:100;
}

@media print {
  .spine-bg{
    background:#ffffff !important;
  }
  .item-wrapper{
    width:30px !important;
  }

  .item-main,
  .spine-bg,
  .name-col{
    width:30px !important;
  }

  .name-text{
    font-size:18px !important;
  }

  .item-wrapper{
  width:49px;
}

.item-wrapper.open{
  width:820px;
}
@media print {

  #topbar,
  #sidebar-home,
  #sidebar-library-menu,
  #library-btn,
  #cursor {
    display:none !important;
  }

  #scroll{
    overflow:visible !important;
    background:#fff !important;
  }

  .item-wrapper.open{
    width:auto !important;
  }

  .item-visual{
    transform:none !important;
  }

  .item-detail{
    position:relative !important;
    left:0 !important;
    transform:none !important;
    width:770px !important;
    border:none !important;
    visibility:visible !important;
    opacity:1 !important;
  }

  .item-main{
    display:none !important;
  }
}
}




/* 페이지 저장 PDF 전용 설정 */
@page{
  size: 210mm 420mm;
  margin:0;
}

@media print{
  html, body{
    width:210mm !important;
    min-height:297mm !important;
    height:auto !important;
    overflow:visible !important;
    background:#fff !important;
    cursor:auto !important;
  }

  #sidebar-home,
  #sidebar-library-menu,

  }

    position:static !important;
    display:block !important;
    width:210mm !important;
    height:auto !important;

<script>
const SPREADSHEET_ID = "1lgA52QAg3-tIM07LVgSJVRmOwjbXmUeWfJ1xou-IE2Y";
const GID = "2070526780";
const CSV_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/export?format=csv&gid=${GID}`;

const K = {
  no:"번호", name:"이름", cat:"분류", period:"시대", paper:"종이",
  size:"크기", coll:"소장처", caption:"caption", captionEn:"caption-en",
  punctImg:"UL-Punctuation", bookImg:"UL-Images"
};

let currentMode = "punct";
const FONT_SIZE = 26;

let allRows = [];
let allWrappers = [];
let openIdx = -1;
const bookMotion = [];

let mouseX = innerWidth / 2;
let mouseY = innerHeight / 2;
let smoothMouseX = mouseX;
let smoothMouseY = mouseY;
let prevSmoothMouseX = smoothMouseX;

let swipeDir = 1;
let hoveredIndex = -1;

const SNAP = 0.05;

const LIBRARY_STORAGE_KEY = "myLibraryBooks";

function getBookId(row){
  return [row[K.no], row[K.name], row[K.period]].filter(Boolean).join("|");
}

function getLibraryBooks(){
  try{
    return JSON.parse(localStorage.getItem(LIBRARY_STORAGE_KEY) || "[]");
  }catch(e){
    console.error(e);
    return [];
  }
}

function saveLibraryBooks(books){
  localStorage.setItem(LIBRARY_STORAGE_KEY, JSON.stringify(books));
}

function isInLibrary(row){
  const id = getBookId(row);
  return getLibraryBooks().some(book => getBookId(book) === id);
}

function addToLibrary(row, target){
  const books = getLibraryBooks();
  const id = getBookId(row);

  if(!books.some(book => getBookId(book) === id)){
    books.push(row);
    saveLibraryBooks(books);
  }

  if(target){
    if(target.classList && target.classList.contains("image-description-wrap")){
      target.classList.add("saved");
    }else{
      target.textContent = "내 서재에 추가됨";
    }
  }
}

function shuffleArray(arr){
  const a = [...arr];
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function parseCSV(t){
  const ln=t.trim().split("\n");
  const hd=splitCSV(ln[0]);
  return ln.slice(1).map(l=>{
    const v=splitCSV(l);
    const o={};
    hd.forEach((h,i)=>{ o[h.trim()]=(v[i]||"").trim(); });
    return o;
  });
}

function splitCSV(l){
  const r=[];let c="";let q=false;
  for(const ch of l){
    if(ch==='"') q=!q;
    else if(ch===','&&!q){r.push(c);c="";}
    else c+=ch;
  }
  r.push(c);
  return r;
}

function getCurrentImage(row){
  return currentMode==="book"
    ? (row[K.bookImg] || row[K.punctImg] || "")
    : (row[K.punctImg] || "");
}

function getSpineMarkType(row){
  const cat = row[K.cat] || "";

  if(cat.includes("괄호")) return "paren";
  if(cat.includes("권표")) return "circle";
  if(cat.includes("구두")) return "comma";

  return "";
}

function createSpineSVG(type){
  const wrap = document.createElement("div");
  wrap.className = `spine-mark mark-${type}`;

  if(!type) return wrap;

  const svgNS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(svgNS, "svg");
  svg.setAttribute("viewBox", "0 0 54 720");
  svg.setAttribute("preserveAspectRatio", "none");
  svg.setAttribute("aria-hidden", "true");

  if(type === "paren"){
    const left = document.createElementNS(svgNS, "path");
    left.setAttribute("d", "M34 70 C18 170 18 550 34 650");

    const right = document.createElementNS(svgNS, "path");
    right.setAttribute("d", "M20 70 C36 170 36 550 20 650");

    svg.appendChild(left);
    svg.appendChild(right);
  }

  if(type === "circle"){
    const ellipse = document.createElementNS(svgNS, "ellipse");
    ellipse.setAttribute("cx", "27");
    ellipse.setAttribute("cy", "360");
    ellipse.setAttribute("rx", "16");
    ellipse.setAttribute("ry", "275");

    svg.appendChild(ellipse);
  }

  if(type === "comma"){
    const fit = document.createElementNS(svgNS, "g");
    fit.setAttribute("transform", "translate(-2.87 0) scale(0.5846)");

    const fitted = document.createElementNS(svgNS, "g");
    fitted.setAttribute("transform", "translate(27 360) scale(0.72) rotate(-90) translate(-27 -360)");

    const flip = document.createElementNS(svgNS, "g");
    flip.setAttribute("transform", "translate(54,0) scale(-1,1)");

    const rotate = document.createElementNS(svgNS, "g");
    rotate.setAttribute("transform", "rotate(142 27 360)");

    const comma = document.createElementNS(svgNS, "path");
    comma.setAttribute("d", "M27 250 C12 250 10 285 24 305 C34 320 42 350 31 390 C48 365 52 325 45 290 C41 265 35 250 27 250 Z");

    rotate.appendChild(comma);
    flip.appendChild(rotate);
    fitted.appendChild(flip);
    fit.appendChild(fitted);
    svg.appendChild(fit);
  }

  wrap.appendChild(svg);
  return wrap;
}

function buildList(rows, shouldShuffle = true){
  const filteredRows = rows.filter(r => r[K.name]);

  allRows = shouldShuffle
    ? shuffleArray(filteredRows)
    : filteredRows;

  const scroll = document.getElementById("scroll");
  scroll.innerHTML = "";

  allWrappers = [];
  bookMotion.length = 0;
  openIdx = -1;
  hoveredIndex = -1;

  allRows.forEach((row,idx)=>{
    const wrapper = document.createElement("div");
    wrapper.className = "item-wrapper";

    const visual = document.createElement("div");
    visual.className = "item-visual";

    const detail = document.createElement("div");
    detail.className = "item-detail";

    const spread = document.createElement("div");
    spread.className = "book-spread";

    const pageL = document.createElement("div");
    pageL.className = "page-left";

    const infoCols = document.createElement("div");
    infoCols.className = "info-cols";

    [
      {key:K.no,    label:"번호"},
      {key:K.name,  label:"이름"},
      {key:K.period,label:"시대"},
      {key:K.cat,   label:"분류"},
      {key:K.coll,  label:"소장처"},
      {key:K.paper, label:"종이"},
      {key:K.size,  label:"크기"}
    ].filter(f=>row[f.key]).forEach(f=>{
      
      const col = document.createElement("div");
      col.className = "info-col";

      const lbl = document.createElement("div");
      lbl.className = "info-label";
      lbl.textContent = f.label;

      const val = document.createElement("div");
      val.className = "info-value";
      val.textContent = row[f.key];

      col.appendChild(lbl);
      col.appendChild(val);
      infoCols.appendChild(col);
    });

    const imageArea = document.createElement("div");
    imageArea.className = "image-area";

    const img = document.createElement("img");
    img.className = "page-img";
    img.dataset.row = idx;

    /* 이미지 아래 설명: 한글 → 영어 순 */
    const captionKr = (row[K.caption] || "").trim();
    const captionEn = (row[K.captionEn] || "").trim();

    const descWrap = document.createElement("div");
    descWrap.className = "image-description-wrap";
    if(isInLibrary(row)){
      descWrap.classList.add("saved");
    }

    descWrap.addEventListener("click", (e)=>{
      e.stopPropagation();
      addToLibrary(row, descWrap);
    });

    const descKr = document.createElement("div");
    descKr.className = "image-description";
    descKr.textContent = captionKr;

    const descEn = document.createElement("div");
    descEn.className = "image-description-en";
    descEn.textContent = captionEn;

    descWrap.appendChild(descKr);
    descWrap.appendChild(descEn);

    infoCols.appendChild(descWrap);

    /* 이미지는 따로 */
    imageArea.appendChild(img);

    pageL.appendChild(infoCols);
    pageL.appendChild(imageArea);

    spread.appendChild(pageL);

    const spreadNav = document.createElement("div");
    spreadNav.className = "spread-nav";

    const prevBox = document.createElement("div");
    prevBox.className = "nav-box prev";
    prevBox.textContent = "이전";

    const nextBox = document.createElement("div");
    nextBox.className = "nav-box next";
    nextBox.textContent = "다음";

    prevBox.addEventListener("click", (e)=>{
      e.stopPropagation();
      if(idx > 0){
        toggleItem(idx - 1);
      }
    });

    nextBox.addEventListener("click", (e)=>{
      e.stopPropagation();
      if(idx < allRows.length - 1){
        toggleItem(idx + 1);
      }
    });

    spreadNav.appendChild(prevBox);
    spreadNav.appendChild(nextBox);
    infoCols.appendChild(spreadNav);

    detail.appendChild(spread);

    const main = document.createElement("div");
    main.className = "item-main";

    const spineType = getSpineMarkType(row);
    const spineMark = createSpineSVG(spineType);
    main.appendChild(spineMark);

    const nc = document.createElement("div");
    nc.className = "name-col";

    const nt = document.createElement("span");
    nt.className = "name-text";
    nt.style.fontSize = FONT_SIZE + "px";

    const title = row[K.name] || "";

    nt.innerHTML = title
      .replaceAll(",", '<span class="jp-comma">、</span>')
      .replaceAll("、", '<span class="jp-comma">、</span>')
      .replaceAll("。", '<span class="jp-comma">。</span>');

    nc.appendChild(nt);
    main.appendChild(nc);

    const mc = document.createElement("div");
    mc.className = "meta-col";

    [row[K.cat], row[K.period], row[K.coll]].filter(Boolean).forEach(v=>{
      const t = document.createElement("span");
      t.className = "meta-text";
      t.textContent = v;
      mc.appendChild(t);
    });

    main.appendChild(mc);

    const bg = document.createElement("div");
    bg.className = "spine-bg";

    const hz = document.createElement("div");
    hz.className = "hover-zone";

    hz.addEventListener("mouseenter",()=>{
      hoveredIndex = idx;
    });

    hz.addEventListener("mouseleave",()=>{
      if(hoveredIndex === idx){
        hoveredIndex = -1;
      }
    });

    hz.addEventListener("click",()=>{
      toggleItem(idx);
    });

    visual.appendChild(detail);
    visual.appendChild(bg);
    visual.appendChild(main);
    visual.appendChild(hz);

    wrapper.appendChild(visual);
    scroll.appendChild(wrapper);

    allWrappers.push(wrapper);
    bookMotion.push({x:0,r:0,tx:0,tr:0});
  });
}

function toggleItem(idx){
  const wrapper = allWrappers[idx];
  const isOpen = wrapper.classList.contains("open");

  if(openIdx >= 0 && openIdx !== idx){
    allWrappers[openIdx].classList.remove("open");

    const oldImg = allWrappers[openIdx].querySelector(".page-img");

    setTimeout(()=>{
      oldImg.src = "";
    },900);
  }

  if(isOpen){
    hoveredIndex = -1;  
    const detail = wrapper.querySelector(".item-detail");
    const img = wrapper.querySelector(".page-img");

    detail.classList.add("closing");

    setTimeout(()=>{
      wrapper.classList.remove("open");
      detail.classList.remove("closing");

      setTimeout(()=>{
        img.src = "";
      },900);

    },500);

    openIdx = -1;

  } else {
    wrapper.classList.add("open");

    const img = wrapper.querySelector(".page-img");
    const src = getCurrentImage(allRows[idx]);

    if(src && img.src !== src){
      img.src = src;
      img.onload = ()=>{
      };
    }

    openIdx = idx;
  }
}

function lerp(a,b,t){return a + (b-a) * t;}
function clamp(v,mn,mx){return Math.max(mn, Math.min(mx,v));}

function updateBookTargets(){
  allWrappers.forEach((w,i)=>{
    const main = w.querySelector(".item-main");
    main.classList.remove("active-hover");

    bookMotion[i].tx = 0;
    bookMotion[i].tr = 0;
  });

  if(hoveredIndex < 0) return;

  const hoveredWrapper = allWrappers[hoveredIndex];
  const hoveredMain = hoveredWrapper.querySelector(".item-main");

  hoveredMain.classList.add("active-hover");

  const rect = hoveredMain.getBoundingClientRect();
  const bookH = rect.height;
  const bookW = rect.width;

  const relY = clamp((smoothMouseY - rect.top) / bookH, 0, 1);
  const angleDeg = lerp(18, 6, relY);
  const rotate = -swipeDir * angleDeg;

  const rad = angleDeg * Math.PI / 180;
  const protrude = bookH * Math.sin(rad) + (bookW / 2) * (1 - Math.cos(rad));

  const hoveredIsOpen = hoveredIndex === openIdx;

  allWrappers.forEach((w,i)=>{
    const d = i - hoveredIndex;
    let shift = 0;
    let rot = 0;

    if(d === 0){
      if(!hoveredIsOpen){
        rot = rotate;
      }

    } else if(!hoveredIsOpen && d > 0){
      if(rotate > 0) shift = protrude;

    } else if(!hoveredIsOpen && d < 0){
      if(rotate < 0) shift = -protrude;
    }

    bookMotion[i].tx = shift;
    bookMotion[i].tr = rot;
  });
}

const cursor = document.getElementById("cursor");
const scrollEl = document.getElementById("scroll");

window.addEventListener("mousemove",e=>{
  mouseX = e.clientX;
  mouseY = e.clientY;
});

scrollEl.addEventListener("scroll",()=>{
  hoveredIndex = -1;

  allWrappers.forEach(w=>{
    w.querySelector(".item-main").classList.remove("active-hover");
  });
},{passive:true});

document.querySelectorAll(".mode-btn").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll(".mode-btn").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");

    currentMode = btn.dataset.mode;

    document.querySelectorAll(".page-img").forEach((img,i)=>{
      if(!allWrappers[i].classList.contains("open")) return;


      setTimeout(()=>{
        img.src = getCurrentImage(allRows[i]);
        img.onload = ()=>{
        };
      },120);
    });
  });
});

function animate(){
  prevSmoothMouseX = smoothMouseX;

  smoothMouseX = lerp(smoothMouseX, mouseX, .18);
  smoothMouseY = lerp(smoothMouseY, mouseY, .18);

  const dx = smoothMouseX - prevSmoothMouseX;

  if(Math.abs(dx) > 0.15){
    swipeDir = dx > 0 ? 1 : -1;
  }

  cursor.style.left = smoothMouseX + "px";
  cursor.style.top = smoothMouseY + "px";

  updateBookTargets();

  allWrappers.forEach((w,i)=>{
    const visual = w.querySelector(".item-visual");
    const main = w.querySelector(".item-main");
    const m = bookMotion[i];

    m.x = lerp(m.x, m.tx, .10);
    m.r = lerp(m.r, m.tr, .08);

    if(Math.abs(m.x - m.tx) < SNAP) m.x = m.tx;
    if(Math.abs(m.r - m.tr) < SNAP) m.r = m.tr;

    visual.style.transform = `translateX(${Math.round(m.x)}px)`;
    main.style.transform = `rotateZ(${m.r}deg)`;
  });

  requestAnimationFrame(animate);
}

  sidebarLibraryMenu.setAttribute("aria-hidden", willOpen ? "false" : "true");

function openLibraryMenu(){

function toGlyphNumber(n){
  const glyphs = ["⓪","➀","➁","➂","➃","➄","➅","➆","➇","➈"];

  return String(n)
    .split("")
    .map(d => {
      const g = glyphs[Number(d)];

      if(g === "⓪"){
        return '<span class="glyph-zero">⓪</span>';
      }

      return '<span class="glyph-num">' + g + '</span>';
    })
    .join("");
}

function renderInfoPage(){
  const topbar = document.getElementById("topbar");
  const scroll = document.getElementById("scroll");

  if(topbar) topbar.style.display = "none";

  scroll.innerHTML = "";
  scroll.style.background = "#fff";
  scroll.style.overflowX = "auto";
  scroll.style.overflowY = "auto";
  scroll.style.display = "block";
  scroll.style.padding = "5px 28px 120px 28px";
  scroll.style.top = "0";
  

  const infoPage = document.createElement("div");
  infoPage.className = "info-page";

  const header = document.createElement("div");
  header.className = "info-table-header";

  const numHeader = document.createElement("div");
  numHeader.className = "info-num-header";
  numHeader.textContent = "번호";

  const gridHeader = document.createElement("div");
  gridHeader.className = "info-grid info-header";

  ["이름", "분류", "시대", "종이", "크기", "소장처"].forEach(text=>{
    const cell = document.createElement("div");
    cell.textContent = text;
    gridHeader.appendChild(cell);
  });

  header.appendChild(numHeader);
  header.appendChild(gridHeader);
  infoPage.appendChild(header);

  const sortedRows = [...allRows].sort((a, b) =>
    (a[K.name] || "").localeCompare((b[K.name] || ""), "ko-KR")
  );

  const grouped = [];
  sortedRows.forEach(row=>{
    const name = row[K.name] || "";
    const last = grouped[grouped.length - 1];

    if(last && last.name === name){
      last.rows.push(row);
    }else{
      grouped.push({
        name,
        rows:[row]
      });
    }
  });

  grouped.forEach((group, index)=>{
    const groupEl = document.createElement("div");
    groupEl.className = "info-table-row";

    const numCell = document.createElement("div");
    numCell.className = "info-num";
    numCell.innerHTML = toGlyphNumber(index + 1);

    const rowsWrap = document.createElement("div");
    rowsWrap.className = "info-rows-wrap";

    group.rows.forEach(row=>{
      const line = document.createElement("div");
      line.className = "info-grid info-row";

      [
        row[K.name],
        row[K.cat],
        row[K.period],
        row[K.paper],
        row[K.size],
        row[K.coll]
      ].forEach(value=>{
        const cell = document.createElement("div");
        cell.textContent = value || "";
        line.appendChild(cell);
      });

      rowsWrap.appendChild(line);
    });

    groupEl.appendChild(numCell);
    groupEl.appendChild(rowsWrap);
    infoPage.appendChild(groupEl);
  });

  scroll.appendChild(infoPage);
}

document.getElementById("library-btn").addEventListener("click", () => {
  const frame = document.getElementById("content-frame");
  frame.src = "library.html";
  frame.style.display = "block";
});

document.getElementById("refresh-btn").addEventListener("click", () => {
  location.reload();
});

const printBtn = document.getElementById("print-btn");

let printMovedDescriptions = [];
let screenRowsBeforePrint = null;

function preparePrintLayout(){
  printMovedDescriptions = [];

  allWrappers.forEach((wrapper) => {
    const infoCols = wrapper.querySelector(".info-cols");
    const imageArea = wrapper.querySelector(".image-area");
    const descWrap = wrapper.querySelector(".image-description-wrap");

    if(!infoCols || !imageArea || !descWrap) return;

    printMovedDescriptions.push({
      descWrap,
      originalParent: descWrap.parentNode,
      originalNextSibling: descWrap.nextSibling
    });

    imageArea.appendChild(descWrap);
  });
}

function restorePrintLayout(){
  printMovedDescriptions.forEach(({descWrap, originalParent, originalNextSibling}) => {
    if(originalNextSibling){
      originalParent.insertBefore(descWrap, originalNextSibling);
    }else{
      originalParent.appendChild(descWrap);
    }
  });

  printMovedDescriptions = [];
}

function formatTitleForHTML(title){
  return title
    .replaceAll(",", '<span class="jp-comma">、</span>')
    .replaceAll("、", '<span class="jp-comma">、</span>')
    .replaceAll("。", '<span class="jp-comma">。</span>');
}

function saveAllPagesAsPDF(){

  screenRowsBeforePrint = [...allRows];

  const printRows = [...allRows].sort((a, b) =>
    (a[K.name] || "").localeCompare(
      b[K.name] || "",
      "ko-KR"
    )
  );

  buildList(printRows, false);
  preparePrintLayout();

  allWrappers.forEach((wrapper, i) => {
    wrapper.classList.add("open");

    const img = wrapper.querySelector(".page-img");
    const src = getCurrentImage(allRows[i]);

    if(src){
      img.src = src;
    }

    const titleEl = wrapper.querySelector(".name-text");
    const title = (allRows[i][K.name] || "").replace(/\s*\([^)]*\)/g, "");

    titleEl.innerHTML = formatTitleForHTML(`${i + 1}. ${title}`);
  });

  setTimeout(() => {
    window.print();
  }, 3000);
}

window.addEventListener("afterprint", () => {
  document.body.classList.remove("pdf-saving");
  restorePrintLayout();

  if(screenRowsBeforePrint){
    buildList(screenRowsBeforePrint, false);
    screenRowsBeforePrint = null;
  }
});

if (printBtn) {
  printBtn.textContent = "저장";
  printBtn.setAttribute("aria-label", "저장");
  printBtn.setAttribute("title", "저장");
  printBtn.addEventListener("click", saveAllPagesAsPDF);
}

){

fetch(CSV_URL)
  .then(r=>{
    if(!r.ok) throw new Error("CSV fetch failed");
    return r.text();
  })
  .then(t=>{
    const rows = parseCSV(t);
    buildList(rows);
  })
  .catch(err=>{
    console.error(err);
    document.getElementById("scroll").style.background = "#d8d8d8";
  });
