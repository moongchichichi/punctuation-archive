<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>문장부호 인식 + 드로우</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500;700;900&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  user-select: none;
  -webkit-user-select: none;
}

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #fff;
  color: #000;
  font-family: "Noto Serif KR", serif;
}

canvas {
  position: fixed;
  left: 0;
  top: 0;
  display: block;
}

#drawCanvas {
  z-index: 5;
  pointer-events: none;
  background: transparent;
}

#result {
  position: fixed;
  inset: 0;
  z-index: 2;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 0 20px 80px 38vw;
  background: #fff;
  mix-blend-mode: normal;
  touch-action: none;
}

#home-btn {
  position: fixed;
  top: 12px;
  left: 14px;
  width: 40px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid #000;
  background: #fff;
  font-family: "Noto Sans KR", sans-serif;
  font-size: 18px;
  font-weight: 700;
  cursor: pointer;
  z-index: 10000;
}

#home-btn:hover {
  background: #d8d8d8;
}

#menuWrap {
  position: fixed;
  right: 20px;
  top: 20px;
  z-index: 10000;
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: "Noto Sans KR", sans-serif;
}

#menuWrap button {
  min-width: 42px;
  height: 38px;
  border: 1px solid #000;
  background: #fff;
  color: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: "Noto Sans KR", sans-serif;
  font-size: .82rem;
  font-weight: 700;
  letter-spacing: .08em;
  line-height: 1;
  padding: 0 16px;
  cursor: pointer;
  transition: background .14s ease, color .14s ease;
}

#menuWrap button.icon-btn {
  width: 40px;
  padding: 0;
  font-size: 19px;
  font-weight: 700;
  letter-spacing: 0;
}

#menuWrap button:hover {
  background: #efefef;
}

#menuWrap button.active {
  background: #d8d8d8;
  color: #000;
}

.top-nav {
  display: none;
}

.punctuation-panel {
  position: fixed;
  left: 0;
  top: 0;
  width: 38vw;
  height: 100vh;
  z-index: 9998;
  display: grid;
  grid-template-rows: 1fr auto;
  border-right: 1px solid #ffffff;
  background: #fff;
  pointer-events: none;
  box-sizing: border-box;
  overflow: hidden;
}

.punctuation-symbol-wrap {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 0;
  padding: 72px 28px 28px;
}

.punctuation-symbol {
  font-family: "Noto Serif KR", serif;
  font-size: clamp(120px, 22vw, 310px);
  font-weight: 200;
  line-height: .82;
  writing-mode: vertical-rl;
  letter-spacing: .1em;
  text-align: center;
  white-space: pre;
}

.punctuation-symbol.mark-gudu {
  transform: translate(-100px, 90px);
}

.punctuation-desc-grid {
  display: block;
  border-top: 1px solid #ffffff;
  min-height: 150px;
  width: 100%;
  box-sizing: border-box;
  position: relative;
  transition: width .78s cubic-bezier(.16, 1, .3, 1);
}

.punctuation-desc-box {
  min-height: 10px;
  padding: 18px 20px 70px;
  font-family: "Noto Sans KR", sans-serif;
  font-size: .9rem;
  font-weight: 700;
  line-height: 1.55;
  letter-spacing: .08em;
  display: flex;
  align-items: flex-start;
}

#result.mark-expand .punctuation-panel {
  overflow: visible;
}

#result.mark-expand .punctuation-desc-grid {
  width: 100vw;
}

.empty-state {
  height: calc(100vh - 80px);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: "Noto Serif KR", serif;
  font-size: 120px;
  font-weight: 400;
  line-height: .9;
  letter-spacing: -.08em;
  pointer-events: none;
}

.keyword-header {
  position: sticky;
  top: 0;
  z-index: 9999;
  display: grid;
  grid-template-columns: minmax(150px, 28vw) 1fr;
  align-items: center;
  border-bottom: 1px solid #ffffff;
  min-height: 92px;
  pointer-events: none;
  background: #fff;
  backdrop-filter: blur(3px);
  mix-blend-mode: normal;
}

.keyword-title,
.keyword-info {
  font-family: "Noto Serif KR", serif;
  font-size: 70px;
  font-weight: 100;
  line-height: .9;
  letter-spacing: -.06em;
}

.keyword-title {
  grid-column: 2;
}

.keyword-info {
  grid-column: 1;
}

.result-item {
  border-top: 1px solid #000000;
  opacity: 0;
  transform: translateY(-18px);
  animation: listDrop .46s cubic-bezier(.16, 1, .3, 1) forwards;
}

@keyframes listDrop {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.result-row {
  display: grid;
  grid-template-columns: 1fr 30px;
  align-items: center;
  min-height: 40px;
  cursor: default;
}

.result-name {
  grid-column: 1;
  min-width: 0;
  min-height: 10px;
  display: flex;
  align-items: center;
  overflow: visible;
  background: transparent;
  color: #000;
  padding: 0 8px;
  font-family: "Noto Serif KR", serif;
  font-size: 34px;
  font-weight: 300;
  line-height: .7;
  letter-spacing: .02em;
  white-space: nowrap;
  cursor: pointer;
  transition: color .2s ease;
}

.result-name span {
  display: inline-block;
  white-space: nowrap;
  padding-right: 20px;
}

.result-name:hover {
  color: #888;
}

.plus {
  grid-column: 2;
  width: 100%;
  padding-right: 10px;
  font-family: "Noto Serif KR", serif;
  font-size: 54px;
  font-weight: 300;
  line-height: 1;
  text-align: right;
  transition: transform .35s ease;
  cursor: pointer;
}

.result-item.open .plus {
  transform: rotate(45deg);
}

.result-detail {
  max-height: 0;
  overflow: hidden;
  transition: max-height .55s ease, padding .55s ease;
}

.result-item.open .result-detail {
  max-height: 180vh;
  padding: 0px 0 18px;
}

.detail-inner {
  display: grid;
  grid-template-columns: minmax(300px, 600px) 1fr;
  padding-left: 0;
  align-items: start;
}

.detail-inner img {
  width: 100%;
  max-width: 100%;
  z-index: 20;
  max-height: 1600px;
  object-fit: contain;
  object-position: top center;
  background: #fff;
  filter: grayscale(1) contrast(1) brightness(1);
  border: 1px solid rgba(0,0,0,.22);
  display: block;
  padding: 0px;
  box-sizing: border-box;
}

.no-image {
  width: 100%;
  min-height: 480px;
  border: 1px solid #000;
  background: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: "Noto Sans KR", sans-serif;
  font-size: .8rem;
  font-weight: 700;
  letter-spacing: .08em;
}

.detail-text {
  font-family: "Noto Serif KR", serif;
  font-size: 1.3rem;
  font-weight: 400;
  line-height: 1.5;
  letter-spacing: .08em;
  user-select: text;
  -webkit-user-select: text;
  writing-mode: vertical-rl;
  text-orientation: mixed;
  height: 350px;
  overflow-x: auto;
  overflow-y: hidden;
}

.detail-text div {
  border-bottom: none;
  border-left: 0 solid rgba(0,0,0,.35);
  padding: 0 0px;
  display: flex;
  align-items: flex-start;
  gap: 0.7em;
}

.detail-text .label {
  font-family: "Noto Serif KR", serif;
  font-size: 1.3rem;
  font-weight: 400;
  letter-spacing: .08em;
  flex: 0 0 3.4em;
  text-align: justify;
  text-align-last: justify;
}

.fail {
  font-family: "Noto Serif KR", serif;
  font-size: 50px;
  font-weight: 400;
  line-height: .9;
  letter-spacing: -.08em;
  border-bottom: 1px solid #000000;
  padding: 28px 0;
  pointer-events: none;
}

@media (max-width: 760px) {
  #result {
    padding-left: 34vw;
  }

  #home-btn {
    left: 14px;
  }

  .punctuation-panel {
    width: 34vw;
  }

  .punctuation-symbol {
    font-size: clamp(86px, 24vw, 160px);
  }

  #result.mark-expand .punctuation-desc-grid {
    width: 100vw;
  }

  .keyword-header {
    grid-template-columns: 1fr;
    min-height: 110px;
  }

  .keyword-info,
  .keyword-title {
    grid-column: 1;
    font-size: 46px;
  }
}
</style>
</head>

<body>

<div id="home-btn">⌂</div>

<canvas id="drawCanvas"></canvas>

<div id="menuWrap" aria-label="상단 메뉴">
  <button id="drawBtn" class="icon-btn" title="DRAW MODE" aria-label="DRAW MODE">✎</button>
  <button id="allBtn" title="ALL ITEMS" aria-label="ALL ITEMS">전체</button>
  <button class="filterBtn" data-filter="구두" title="구두">구두</button>
  <button class="filterBtn" data-filter="권표" title="권표">권표</button>
  <button class="filterBtn" data-filter="괄호" title="괄호">괄호</button>
</div>

<div id="result">
  <aside class="punctuation-panel" aria-label="문장부호 표시 영역">
    <div class="punctuation-symbol-wrap">
      <div class="punctuation-symbol"></div>
    </div>
    <div class="punctuation-desc-grid">
      <div class="punctuation-desc-box">마우스로 자유롭게 그려보세요!</div>
    </div>
  </aside>
  <div class="top-nav"></div>
  <div class="empty-state"></div>
</div>

<script>
const SPREADSHEET_ID = "1lgA52QAg3-tIM07LVgSJVRmOwjbXmUeWfJ1xou-IE2Y";
const GID = "2070526780";
const CSV_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/export?format=csv&gid=${GID}`;

const K = {
  name: "이름",
  cat: "분류",
  period: "시대",
  paper: "종이",
  size: "크기",
  coll: "소장처",
  img: "UL-Images",
  sym: "UL-Punctuation"
};

const drawBtn = document.getElementById("drawBtn");
const allBtn = document.getElementById("allBtn");
const filterBtns = document.querySelectorAll(".filterBtn");

const canvas = document.getElementById("drawCanvas");
const ctx = canvas.getContext("2d");
const result = document.getElementById("result");

let drawing = false;
let points = [];
let sheetRows = [];
let currentList = [];
let currentKeyword = "";

function getDisplaySymbol(keyword) {
  if ((keyword || "").includes("괄호")) return " ︵  ︶   ";
  if ((keyword || "").includes("구두")) return "。、";
  if ((keyword || "").includes("권표")) return "◯";
  if (keyword === "ALL") return "";
  if (keyword === "DRAW MODE") return "";
  return " ";
}

function getInfoLabel(keyword) {
  if ((keyword || "").includes("구두")) return "구두점";
  if ((keyword || "").includes("괄호")) return "괄호";
  if ((keyword || "").includes("권표")) return "권표";
  if (keyword === "ALL") return "전체";
  if (keyword === "DRAW MODE") return "마우스로 자유롭게 그려보세요!";
  return " 마우스로 자유롭게 그려보세요! ";
}

function renderPunctuationPanel(keyword) {
  const markClass = (keyword || "").includes("구두") ? "mark-gudu" : "";
  const infoText = getInfoLabel(keyword);

  return `
    <aside class="punctuation-panel" aria-label="문장부호 표시 영역">
      <div class="punctuation-symbol-wrap">
        <div class="punctuation-symbol ${markClass}">${escapeHTML(getDisplaySymbol(keyword))}</div>
      </div>
      <div class="punctuation-desc-grid">
        <div class="punctuation-desc-box">${escapeHTML(infoText)}</div>
      </div>
    </aside>
  `;
}

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

window.addEventListener("resize", resizeCanvas);
resizeCanvas();

function parseCSV(text) {
  const rows = [];
  let row = [];
  let cur = "";
  let quote = false;

  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    const next = text[i + 1];

    if (ch === '"' && quote && next === '"') {
      cur += '"';
      i++;
    } else if (ch === '"') {
      quote = !quote;
    } else if (ch === "," && !quote) {
      row.push(cur);
      cur = "";
    } else if ((ch === "\n" || ch === "\r") && !quote) {
      if (cur || row.length) {
        row.push(cur);
        rows.push(row);
        row = [];
        cur = "";
      }
      if (ch === "\r" && next === "\n") i++;
    } else {
      cur += ch;
    }
  }

  if (cur || row.length) {
    row.push(cur);
    rows.push(row);
  }

  const headers = rows.shift();

  return rows.map(r =>
    Object.fromEntries(
      headers.map((h, i) => [h.trim(), r[i]?.trim() || ""])
    )
  );
}

function extractImageUrls(value) {
  if (!value) return [];

  const raw = String(value);
  const urls = raw.match(/https?:\/\/[^\s,"')]+/g);
  if (urls) return urls.map(v => v.trim());

  return raw
    .split(/\s*,\s*|\s*\n\s*/)
    .map(v => v.trim())
    .filter(v => v.startsWith("http"));
}

function getPunctuationImage(item) {
  const punctuationImages = extractImageUrls(item[K.sym]);
  if (punctuationImages.length) return punctuationImages[0];

  const fallbackImages = extractImageUrls(item[K.img]);
  if (fallbackImages.length) return fallbackImages[0];

  return "";
}

async function loadSheet() {
  try {
    const csvText = await fetch(CSV_URL).then(r => r.text());
    sheetRows = parseCSV(csvText);
  } catch (err) {
    console.error("CSV 로드 실패:", err);
    showList([], "데이터 로드 실패");
  }
}

loadSheet();

result.addEventListener("pointerdown", e => {
  if (e.target.closest(".result-name, .plus, .result-detail")) return;

  e.preventDefault();

  drawing = true;
  points = [];

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  addPoint(e);
});

result.addEventListener("pointermove", e => {
  if (!drawing) return;

  e.preventDefault();

  addPoint(e);
  drawLine();
});

result.addEventListener("pointerup", () => {
  if (!drawing) return;

  drawing = false;
  recognizeShape();
});

result.addEventListener("pointercancel", () => {
  if (!drawing) return;

  drawing = false;
  recognizeShape();
});

function addPoint(input, y) {
  if (typeof input === "number") {
    points.push({ x: input, y: y });
  } else {
    points.push({ x: input.clientX, y: input.clientY });
  }
}

function drawLine() {
  if (points.length < 3) return;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.beginPath();
  ctx.moveTo(points[0].x, points[0].y);

  for (let i = 1; i < points.length - 1; i++) {
    const current = points[i];
    const next = points[i + 1];

    const xc = (current.x + next.x) / 2;
    const yc = (current.y + next.y) / 2;

    ctx.quadraticCurveTo(
      current.x,
      current.y,
      xc,
      yc
    );
  }

  ctx.strokeStyle = "#d1d1d1";
  ctx.lineWidth = 3;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.stroke();
}

function distance(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

function pathLength() {
  let len = 0;

  for (let i = 1; i < points.length; i++) {
    len += distance(points[i - 1], points[i]);
  }

  return len;
}

function getBounds() {
  let minX = Infinity;
  let maxX = -Infinity;
  let minY = Infinity;
  let maxY = -Infinity;

  points.forEach(p => {
    minX = Math.min(minX, p.x);
    maxX = Math.max(maxX, p.x);
    minY = Math.min(minY, p.y);
    maxY = Math.max(maxY, p.y);
  });

  return {
    minX,
    maxX,
    minY,
    maxY,
    width: maxX - minX,
    height: maxY - minY
  };
}

function recognizeShape() {
  if (points.length < 2) return;

  const start = points[0];
  const end = points[points.length - 1];
  const len = pathLength();
  const closeDist = distance(start, end);
  const box = getBounds();

  const width = box.width;
  const height = box.height;

  let keyword = "";

  if (len < 90 && width < 90 && height < 90) {
    keyword = "구두";
  }

  else if (
    closeDist < 80 &&
    len > 120 &&
    width > 40 &&
    height > 40 &&
    Math.abs(width - height) < 80
  ) {
    keyword = "권표";
  }

  else if (
    width > 70 &&
    len > 70 &&
    closeDist > 70 &&
    height > 12 &&
    height < width * 0.5
  ) {
    const quarter = points[Math.floor(points.length * 0.25)];
    const middle  = points[Math.floor(points.length * 0.5)];
    const threeQ  = points[Math.floor(points.length * 0.75)];

    const curveSpread =
      Math.abs(middle.y - quarter.y) +
      Math.abs(middle.y - threeQ.y);

    if (curveSpread > 10) {
      keyword = "괄호";
    }
  }

  if (keyword) {
    handleResult(keyword);
  } else {
    showList([], "no result");
  }
}

function handleResult(keyword) {
  const filtered = sheetRows.filter(row =>
    (row[K.cat] || "").includes(keyword)
  );

  showList(shuffleArray(filtered), keyword);
}

function escapeHTML(str) {
  return String(str || "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function imageHTML(src, alt = "") {
  if (!src) return `<div class="no-image">NO PUNCTUATION IMAGE</div>`;
  return `<img src="${escapeHTML(src)}?t=${Date.now()}" alt="${escapeHTML(alt)}" referrerpolicy="no-referrer">`;
}

function showList(list, keyword) {
  result.classList.remove("mark-expand");

  currentList = list;
  currentKeyword = keyword;

  let html = `${renderPunctuationPanel(keyword)}<div class="top-nav"></div>`;

  if (!list.length) {
    html += `
      <div class="fail">${escapeHTML(keyword)}</div>
      <div class="result-item">
        <div class="result-row">
          <div class="result-name"><span> </span></div>
        </div>
      </div>
    `;

    result.innerHTML = html;
    bindResultRows();
    updateActiveButtons(keyword);
    return;
  }

  html += `
    <div class="keyword-header">
      <div class="keyword-info">${list.length} RESULTS</div>
      <div class="keyword-title"></div>
    </div>
  `;

  html += renderRows(list);

  result.innerHTML = html;
  bindResultRows();
  updateActiveButtons(keyword);
}

function renderRows(list) {
  let html = "";

  list.forEach((item, index) => {
    const img = getPunctuationImage(item);

    html += `
      <div class="result-item" style="animation-delay:${index * 0.055}s">
        <div class="result-row">
          <div class="result-name"><span>${escapeHTML(item[K.name])}</span></div>
          <div class="plus">+</div>
        </div>

        <div class="result-detail">
          <div class="detail-inner">
            ${imageHTML(img, item[K.name])}
            <div class="detail-text">
              <div><span class="label">이름</span> ${escapeHTML(item[K.name])}</div>
              <div><span class="label">분류</span> ${escapeHTML(item[K.cat])}</div>
              <div><span class="label">시대</span> ${escapeHTML(item[K.period])}</div>
              <div><span class="label">종이</span> ${escapeHTML(item[K.paper])}</div>
              <div><span class="label">크기</span> ${escapeHTML(item[K.size])}</div>
              <div><span class="label">소장처</span> ${escapeHTML(item[K.coll])}</div>
            </div>
          </div>
        </div>
      </div>
    `;
  });

  return html;
}

function bindResultRows() {
  document.querySelectorAll(".result-name, .plus").forEach(el => {
    el.addEventListener("click", e => {
      e.stopPropagation();
      el.closest(".result-item").classList.toggle("open");
    });
  });
}

function playMarkExpandMotion() {
  result.classList.remove("mark-expand");

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      result.classList.add("mark-expand");
    });
  });
}

function resetToDrawMode() {
  currentList = [];
  currentKeyword = "";

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  result.innerHTML = `
    ${renderPunctuationPanel("DRAW MODE")}
    <div class="top-nav"></div>
    <div class="empty-state"></div>
  `;

  updateActiveButtons("DRAW MODE");
  playMarkExpandMotion();
}

function shuffleArray(arr) {
  return [...arr].sort(() => Math.random() - 0.5);
}

function updateActiveButtons(keyword) {
  drawBtn.classList.toggle("active", keyword === "DRAW MODE");
  allBtn.classList.toggle("active", keyword === "ALL");

  filterBtns.forEach(btn => {
    btn.classList.toggle("active", btn.dataset.filter === keyword);
  });
}

drawBtn.addEventListener("click", e => {
  e.stopPropagation();
  resetToDrawMode();
});

allBtn.addEventListener("click", e => {
  e.stopPropagation();
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  showList(sheetRows, "ALL");
});

filterBtns.forEach(btn => {
  btn.addEventListener("click", e => {
    e.stopPropagation();

    const keyword = btn.dataset.filter;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const filtered = sheetRows.filter(row =>
      (row[K.cat] || "").includes(keyword)
    );

    showList(shuffleArray(filtered), keyword);
  });
});

playMarkExpandMotion();

document.getElementById("home-btn").addEventListener("click", () => {
  window.location.href = "index.html";
});
</script>

</body>
</html>
