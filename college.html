<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>문장부호 인식 + 드로우</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500;700;900&family=Noto+Sans+KR:wght@300;400;500;700;900&family=Noto+Serif+JP:wght@400;500;700&display=swap');

@font-face {
  font-family: 'OnulSamhwamyeongjo';
  src: url('./OnulSamhwamyeongjo-Regular.woff') format('woff');
  font-weight: normal;
  font-style: normal;
}

:root {
  --sidebar: 210px;
  --half-content: calc((100vw - var(--sidebar)) / 2);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  user-select: none;
  -webkit-user-select: none;
}

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #fff;
  color: #000;
  font-family: "Noto Serif KR", serif;
}

canvas {
  position: fixed;
  left: 0;
  top: 0;
  display: block;
}

#drawCanvas {
  z-index: 5;
  pointer-events: none;
  background: transparent;
}

#menuInfo{
  margin-right:auto;
  font-family:'OnulSamhwamyeongjo', serif;
  font-size:1rem;
  font-weight:500;
  letter-spacing:.05em;
  color:#000;
  white-space:nowrap;
  transform:translateY(-4px);
}

#result {
  position: fixed;
  inset: 0;
  left: var(--sidebar);
  z-index: 2;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 70px 20px 80px calc(var(--half-content) + 10px);
  background: #fff;
  mix-blend-mode: normal;
  touch-action: none;
}

/* 크롬, 사파리 */
#result::-webkit-scrollbar {
  width: 2px;
}

#result::-webkit-scrollbar-track {
  background: transparent;
}

#result::-webkit-scrollbar-thumb {
  background: #000;
}

/* 파이어폭스 */
#result {
  scrollbar-width: thin;
  scrollbar-color: #000 transparent;
}

#sidebar{
  position:fixed;
  top:0;
  left:0;
  width:210px;
  height:100vh;
  background:#fff;
  border-right:1px solid #888;
  z-index:10001;
  padding:20px;
}

#sidebar-home,
#sidebar-library,
#sidebar-punctuation,
#sidebar-info{
  position:fixed;
  left:14px;
  width:180px;
  height:33px;

  font-family:'OnulSamhwamyeongjo', serif;
  font-size:1rem;
  font-weight:500;
  letter-spacing:.05em;

  border:none;
  border-top:1.5px solid #595959;
  border-bottom:1.5px solid transparent;

  background:transparent;

  display:flex;
  align-items:center;

  cursor:pointer;
  z-index:10000;
}

#sidebar-home{
  top:15px;
}

#sidebar-library{
  top:42px;
}

#sidebar-punctuation{
  top:69px;   /* 현재 페이지 표시 */
}

#sidebar-punctuation-menu{
  position:fixed;
  top:102px;
  left:14px;
  width:180px;

  display:none;

  z-index:10000;
}

#sidebar-punctuation-menu.open{
  display:block;
}

.sidebar-sub-btn{
  width:160px;
  height:20px;
  margin:0 0 4px 19px;
  padding-top:5px;

  font-family:'OnulSamhwamyeongjo', serif;
  font-size:1rem;
  font-weight:500;
  letter-spacing:.05em;
  line-height:0.9;

  border:none;
  border-top:1.5px solid #595959;
  border-bottom:1.5px solid transparent;
  background:transparent;

  display:flex;
  align-items:center;
  justify-content:flex-start;
  cursor:pointer;
}

.sidebar-sub-btn:hover,
.sidebar-sub-btn.active{
  color:#9f9f9f;
}

#sidebar-info{
  bottom:15px;
}

#sidebar-home:hover,
#sidebar-library:hover,
#sidebar-punctuation:hover,
#sidebar-info:hover{
  color:#9f9f9f;
}

#menuWrap {
  position: fixed;
  top: 10px;
  left: 210px;
  right: 0;
  width: auto;
  height: 42px;

  z-index: 10000;

  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 7px;

  padding: 0 24px 0 10px;

  background: rgba(255, 255, 255, 0.96);
  backdrop-filter: blur(10px);

  font-family: 'OnulSamhwamyeongjo', serif;
}

#menuWrap button {
  position: static;
  width: auto;
  min-width: max-content;
  height: 33px;
  padding: 0 30px 0 0;

  appearance: none;
  -webkit-appearance: none;

  border: none;
  border-top: 1.5px solid #000000;
  border-bottom: 1.5px solid transparent;

  background: transparent;
  color: #000;

  display: flex;
  align-items: center;
  justify-content: flex-start;

  font-family: 'OnulSamhwamyeongjo', serif;
  font-size: 1rem;
  font-weight: 500;
  letter-spacing: .06em;
  line-height: 1;

  cursor: pointer;
  transition: background .14s linear, color .14s linear;
}

#menuWrap button.icon-btn {
  width: 33px;
  padding: 0;
  font-size: 1rem;
  font-weight: 500;
  letter-spacing: .05em;
  justify-content: center;
}

#menuWrap button:hover {
  color: #989898;
}

#menuWrap button.active {
  color: #959595;
}

.top-nav {
  display: none;
}

.punctuation-panel {
  position: fixed;
  left:var(--sidebar);;
  top: 0;
  width: var(--half-content);
  min-width: 220px;
  height: 100vh;
  z-index: 9998;
  display: grid;
  grid-template-rows: 1fr auto;
  border-right: 1px solid #000000;
  background: #fff;
  pointer-events: none;
  box-sizing: border-box;
  overflow: hidden;
}

.punctuation-symbol-wrap {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 0;
  padding: 72px 28px 28px;
}

.punctuation-symbol {
  font-family: "Noto Serif KR", serif;
  font-size: clamp(120px, 22vw, 310px);
  font-weight: 200;
  line-height: .82;
  writing-mode: vertical-rl;
  letter-spacing: .1em;
  text-align: center;
  white-space: pre;
}

.punctuation-symbol.mark-gudu {
  transform: translate(-100px, 90px);
}

.punctuation-desc-grid {
  display: block;
  border-top: 1px solid #ffffff;
  min-height: 150px;
  width: 100%;
  box-sizing: border-box;
  position: relative;
  transition: width .78s cubic-bezier(.16, 1, .3, 1);
}

.punctuation-desc-box {
  min-height: 10px;
  padding: 0px 20px 0px;
  font-family: "Noto Sans KR", sans-serif;
  font-size: .9rem;
  font-weight: 400;
  line-height: 1.55;
  letter-spacing: .08em;
  display: flex;
  align-items: flex-start;
}

#result.mark-expand .punctuation-panel {
  overflow: visible;
}

#result.mark-expand .punctuation-desc-grid {
  width: 100vw;
}

.empty-state {
  height: calc(100vh - 80px);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: "Noto Serif KR", serif;
  font-size: 120px;
  font-weight: 400;
  line-height: .9;
  letter-spacing: -.08em;
  pointer-events: none;
}

.keyword-header {
  position: sticky;
  top: 60;
  z-index: 9999;
  display: grid;
  grid-template-columns: minmax(150px, 22vw) 1fr;
  align-items: center;
  border-bottom: 1px solid #ffffff;
  min-height: 92px;
  pointer-events: none;
  background: #fff;
  backdrop-filter: blur(3px);
  mix-blend-mode: normal;
}

.keyword-title,
.keyword-info {
  font-family: "Noto Sans KR", sans-serif;
  font-size: 70px;
  font-weight: 100;
  line-height: .9;
  letter-spacing: -.06em;
}

.keyword-title {
  grid-column: 2;
}

.keyword-info {
  grid-column: 1;
}

.result-item {
  /*border-top: 1px solid #000000;*/
  opacity: 0;
  transform: translateY(-18px) translateX(-10px);
  animation: listDrop .46s cubic-bezier(.16, 1, .3, 1) forwards;
}

.punctuation-panel {
  overflow: visible;
}

.panel-floating-img {
  position: absolute;
  left: 25px;
  top: 120px;
  width: 600px;
  height: 50vh;
  object-fit: cover;
  z-index: 10;
  pointer-events: none;
  opacity: 0.7;

  filter: grayscale(1) contrast(1.12) brightness(.92) saturate(0) sepia(.08);
}

@keyframes listDrop {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.result-row {
  display: grid;
  grid-template-columns: 1fr 30px;
  align-items: center;
  min-height: 27px;
  cursor: default;
}

.result-name {
  grid-column: 1;
  min-width: 0;
  height:7px;
  display: flex;
  align-items: center;
  overflow: visible;
  background: transparent;
  color: #000;
  padding: 0 0px;
  font-family: 'OnulSamhwamyeongjo', serif;
  font-size: 20px;
  font-weight: 300;
  line-height:1;
  letter-spacing:.01em;
  white-space: nowrap;
  cursor: pointer;
  transition: color .2s ease;
  transform: translateY(-21px);
}

.result-name span {
  display: inline-block;
  white-space: nowrap;
  padding-right: 20px;
}

.result-name:hover {
  color: #888;
}

.result-name {
  position: relative;
}

.result-name:hover {
  color: #888;
}

.result-name::after {
  content: "";
  position: absolute;
  left: 0;
  width: 100%;
  height: 1px;
  background: #000;

  bottom: -5px;
  opacity: 0;
}

.result-name:hover::after {
  opacity: 1;
  bottom: -10px ;
}


.plus {
  grid-column: 2;
  width: 100%;
  padding-right: 10px;
  font-family: "Noto Serif KR", serif;
  font-size: 30px;
  font-weight: 300;
  line-height: 1;
  text-align: right;
  transition: transform .35s ease;
  cursor: pointer;
}

.result-item.open .plus {
  transform: rotate(45deg);
}

.result-detail {
  max-height: 0;
  overflow: hidden;
  transition: max-height .55s ease, padding .55s ease;
}

.result-item.open .result-detail {
  max-height:2000px;
  padding: 0px 0 0px;
}

.detail-inner {
  width: 770px;
  height: auto;
  display: flex;
  flex-direction: column;
  background: #fff;
  font-family: "Noto Sans KR", sans-serif;
  position: relative;
  border-left: 1.5px solid #ffffff;
  border-right: 1.5px solid #838383;
  transform: translateX(-22px);
}

.book-spread {
  width: 960px;
  min-height: 800px;
  height: auto;
  display: flex;
  flex-direction: column;
  background: #fff;
  font-family: "Noto Sans KR", sans-serif;
}

.page-left {
  width: 100%;
  min-height: 800px;
  height: auto;
  overflow: visible;
  background: #ffffff;
  flex-shrink: 0;
  display: grid;
  grid-template-columns: 150px 1fr;
  gap: 24px;
  align-items: start;
  padding:0px 28px 300px 28px;
  position: relative;
}

.info-cols {
  width: 300px;
  height: 100%;
  display: flex;
  flex-direction: column;
  gap: 9px;
  position: relative;
}

.info-cols::before {
  content: "";
  display: block;
  position: absolute;
  top: -27px;
  left: -6px;
  width: 970px;
  height: 2px;
  background: #ffffff;
  margin-bottom: 12px;
}

.info-col {
  display: grid;
  grid-template-columns: 42px 1fr;
  gap: 5px;
  align-items: start;
  opacity: 0;
  transform: none;
  transition: opacity .5s linear;
}

.result-item.open .info-col,
.result-item.open .image-description-wrap,
.result-item.open .image-description,
.result-item.open .page-img,
.result-item.open .info-cols::before,
.result-item.open .spread-nav,
.result-item.open .image-description-en {
  opacity: 1;
  transform: none;
  transition: opacity .5s linear .35s;
}

.result-item:not(.open) .info-col,
.result-item:not(.open) .image-description-wrap,
.result-item:not(.open) .image-description,
.result-item:not(.open) .page-img,
.result-item:not(.open) .info-cols::before,
.result-item:not(.open) .spread-nav,
.result-item:not(.open) .image-description-en {
  opacity: 0;
  transform: none;
  transition: opacity .2s linear 0s;
}

.info-label,
.info-value {
  writing-mode: horizontal-tb;
  text-orientation: mixed;
  font-family: "Noto Sans KR", sans-serif;
  font-size: .85rem;
  font-weight: 400;
  line-height: 1.3;
  margin: 0;
  padding: 0;
  letter-spacing: .04em;
  white-space: normal;
  overflow-wrap: anywhere;
  word-break: break-all;
  hyphens: auto;
  user-select: text;
  -webkit-user-select: text;
}

.info-label {
  color: #000;
  transform: translateX(-6px);
}

.info-value { color: #000; }

.image-area {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 18px;
}

.page-img {
  width: 490px;
  height: 400px;
  object-fit: cover;
  box-sizing: border-box;
  opacity: 1;
  transition: transform .42s cubic-bezier(.22,1,.36,1);
  filter: grayscale(1) contrast(1.12) brightness(.92) saturate(0) sepia(.08);
  background: #fff;
  display: block;
}

.result-item.open .page-img {
  opacity: .96;
  transform: scale(1);
}

.no-image {
  width: 480px;
  height: 400px;
  border: 1.5px solid #ffffff;
  background: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: "Noto Sans KR", sans-serif;
  font-size: .8rem;
  font-weight: 400;
  letter-spacing: .08em;
}

.image-description-wrap {
  position: absolute;
  left: -5px;
  top: 170px;
  width: 840px;
  line-height: 2;
  letter-spacing: 1.2px;
  border-top: 1px solid #ffffff;
  border-bottom: 1px solid #ffffff;
  padding-top: 4px;
  padding-bottom: 6px;
  display: grid;
  grid-template-columns: 300px 300px;
  gap: 20px;
  align-items: start;
  cursor: default;
  opacity: 0;
}


.image-description,
.image-description-en {
  color: #000;
  width: 300px;
  max-width: 300px;
  word-break: keep-all;
  overflow-wrap: break-word;
  opacity: 0;
  transform: none;
  transition: opacity .5s linear;
  user-select: text;
  -webkit-user-select: text;
}

.image-description {
  font-family: "Noto Sans KR", sans-serif;
  font-size: .9rem;
  line-height:1.8;
  font-weight: 400;
  color: #000000c6;
  letter-spacing: 0.04em;
}

.image-description-en {
  font-family: "Helvetica Neue", Arial, sans-serif;
  font-size: .95rem;
  font-weight: 300;
  line-height: 1.6;
  letter-spacing:.01em;
}


.fail {
  font-family: "Noto Serif KR", serif;
  font-size: 30px;
  font-weight: 400;
  line-height: 2.5rem;
  letter-spacing: .02em;
  border-bottom: 1px solid #ffffff;
  padding-top: 5px;
  pointer-events: none;
}

.info-page{
  min-width:1080px;
  width:100%;
  font-family:'SM3Gothic', 'Noto Sans KR', sans-serif;
  font-size:.95rem;
  line-height:1.6;
  letter-spacing:-.05px;
  padding:5px 28px 120px 28px;
}

.info-table-header,
.info-table-row{
  display:grid;
  grid-template-columns:minmax(64px, 80px) 1fr;
}

.info-num-header,
.info-num{
  padding:0;
  border-right:1px solid #ffffff;
  border-bottom:1px solid #ffffff;
}

.info-num-header{
  position:sticky;
  top:0;
  z-index:20;
  background:#ffffff;
  color:#000000;
  font-size:.8rem;
  font-weight:700;
  line-height:3;
}

.glyph-num{font-size:1.2rem;}
.glyph-zero{font-size:1rem;}

.info-grid{
  display:grid;
  grid-template-columns:
    minmax(240px, 2.2fr)
    minmax(90px, .8fr)
    minmax(110px, .9fr)
    minmax(50px, .9fr)
    minmax(230px, 1.4fr)
    minmax(220px, 1.7fr);
  align-items:start;
}

.info-header{
  position:sticky;
  top:0;
  z-index:20;
  background:#ffffff;
  color:#000000;
  font-size:.8rem;
  font-weight:700;
  line-height:3;
}

.info-header div,
.info-row div{
  padding:0 8px;
  border-right:1px solid #ffffff;
  border-bottom:1px solid #ffffff;
  word-break:keep-all;
  overflow-wrap:anywhere;
}

.info-row{
  background:#fff;
  color:#000;
}

.info-table-row:hover .info-row,
.info-table-row:hover .info-num{
  color:#242424;
}

@media (max-width: 760px) {
  #result {
    padding-left: 34vw;
  }

  #home-btn {
    left: 14px;
  }

  .punctuation-panel {
    width: 34vw;
  }

  .punctuation-symbol {
    font-size: clamp(86px, 24vw, 160px);
  }

  #result.mark-expand .punctuation-desc-grid {
    width: 100vw;
  }

  .keyword-header {
    grid-template-columns: 1fr;
    min-height: 110px;
  }

  .keyword-info,
  .keyword-title {
    grid-column: 1;
    font-size: 46px;
  }
}
</style>
</head>

<body>

<div id="sidebar">
  <div id="sidebar-home">아카이브 홈</div>
  <div id="sidebar-library">서재 탐색</div>

  <div id="sidebar-punctuation">문장부호 검색</div>
  <div id="sidebar-punctuation-menu">
    <button class="sidebar-sub-btn" id="sidebar-draw" type="button">드로우</button>
    <button class="sidebar-sub-btn" id="sidebar-all" type="button">전체</button>
    <button class="sidebar-sub-btn sidebar-filter" data-filter="구두" type="button">구두</button>
    <button class="sidebar-sub-btn sidebar-filter" data-filter="권표" type="button">권표</button>
    <button class="sidebar-sub-btn sidebar-filter" data-filter="괄호" type="button">괄호</button>
  </div>

  <div id="sidebar-info">Info</div>
</div>

<canvas id="drawCanvas"></canvas>

<div id="menuWrap" aria-label="상단 메뉴">
  <div id="menuInfo">〔마우스로 자유롭게 그려보세요.〕</div>
  <button id="drawBtn" class="icon-btn" title="DRAW MODE" aria-label="DRAW MODE">✎</button>
  <button id="allBtn" title="ALL ITEMS" aria-label="ALL ITEMS">전체</button>
  <button class="filterBtn" data-filter="구두" title="구두">구두</button>
  <button class="filterBtn" data-filter="권표" title="권표">권표</button>
  <button class="filterBtn" data-filter="괄호" title="괄호">괄호</button>
</div>

<div id="result">
  <aside class="punctuation-panel" aria-label="문장부호 표시 영역">
    <div class="punctuation-symbol-wrap">
      <div class="punctuation-symbol"></div>
    </div>
    <div class="punctuation-desc-grid">
      <div class="punctuation-desc-box"></div>
    </div>
  </aside>
  <div class="top-nav"></div>
  <div class="empty-state"></div>
</div>

<script>
const SPREADSHEET_ID = "1lgA52QAg3-tIM07LVgSJVRmOwjbXmUeWfJ1xou-IE2Y";
const GID = "2070526780";
const CSV_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/export?format=csv&gid=${GID}`;

const K = {
  name: "이름",
  cat: "분류",
  period: "시대",
  paper: "종이",
  size: "크기",
  coll: "소장처",
  caption: "caption",
  captionEn: "caption-en",
  img: "UL-Images",
  sym: "UL-Punctuation"
};

const drawBtn = document.getElementById("drawBtn");
const allBtn = document.getElementById("allBtn");
const filterBtns = document.querySelectorAll(".filterBtn");

const canvas = document.getElementById("drawCanvas");
const ctx = canvas.getContext("2d");
const result = document.getElementById("result");

let drawing = false;
let points = [];
let sheetRows = [];
let currentList = [];
let currentKeyword = "";

function getDisplaySymbol(keyword) {
  if ((keyword || "").includes("괄호")) return " ︵  ︶   ";
  if ((keyword || "").includes("구두")) return "。、";
  if ((keyword || "").includes("권표")) return "◯";
  if (keyword === "ALL") return "";
  if (keyword === "DRAW MODE") return "";
  return " ";
}

function getInfoLabel(keyword) {
  if (keyword === "DRAW MODE")
    return "마우스로 자유롭게 그려보세요!";

  return `마우스로 자유롭게 그려보세요!      ${currentList.length} RESULTS`;
}

function renderPunctuationPanel(keyword) {
  const markClass = (keyword || "").includes("구두") ? "mark-gudu" : "";
  const infoText = getInfoLabel(keyword);

  return `
    <aside class="punctuation-panel" aria-label="문장부호 표시 영역">
      <div class="punctuation-symbol-wrap">
        <div class="punctuation-symbol ${markClass}">${escapeHTML(getDisplaySymbol(keyword))}</div>
      </div>
      <div class="punctuation-desc-grid">
        <div class="punctuation-desc-box"></div>
      </div>

      <img class="panel-floating-img" id="panelFloatingImg" src="" alt="">
    </aside>
  `;
}

  canvas.height = window.innerHeight;

function parseCSV(text) {
  const rows = [];
  let row = [];
  let cur = "";
  let quote = false;

  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    const next = text[i + 1];

    if (ch === '"' && quote && next === '"') {
      cur += '"';
      i++;
    } else if (ch === '"') {
      quote = !quote;
    } else if (ch === "," && !quote) {
      row.push(cur);
      cur = "";
    } else if ((ch === "\n" || ch === "\r") && !quote) {
      if (cur || row.length) {
        row.push(cur);
        rows.push(row);
        row = [];
        cur = "";
      }
      if (ch === "\r" && next === "\n") i++;
    } else {
      cur += ch;
    }
  }

  if (cur || row.length) {
    row.push(cur);
    rows.push(row);
  }

  const headers = rows.shift();

  return rows.map(r =>
    Object.fromEntries(
      headers.map((h, i) => [h.trim(), r[i]?.trim() || ""])
    )
  );
}

function extractImageUrls(value) {
  if (!value) return [];

  const raw = String(value);
  const urls = raw.match(/https?:\/\/[^\s,"')]+/g);
  if (urls) return urls.map(v => v.trim());

  return raw
    .split(/\s*,\s*|\s*\n\s*/)
    .map(v => v.trim())
    .filter(v => v.startsWith("http"));
}

function getPunctuationImage(item) {
  const punctuationImages = extractImageUrls(item[K.sym]);
  if (punctuationImages.length) return punctuationImages[0];

  const fallbackImages = extractImageUrls(item[K.img]);
  if (fallbackImages.length) return fallbackImages[0];

  return "";
}

async function loadSheet() {
  try {
    const csvText = await fetch(CSV_URL).then(r => r.text());
    sheetRows = parseCSV(csvText);
  } catch (err) {
    console.error("CSV 로드 실패:", err);
    showList([], "데이터 로드 실패");
  }
}

result.addEventListener("pointerdown", e => {
  if (e.target.closest(".result-name, .plus, .result-detail")) return;

  e.preventDefault();

  drawing = true;
  points = [];

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  addPoint(e);
});

result.addEventListener("pointermove", e => {
  if (!drawing) return;

  e.preventDefault();

  addPoint(e);
  drawLine();
});

result.addEventListener("pointerup", () => {
  if (!drawing) return;

  drawing = false;
  recognizeShape();
});

result.addEventListener("pointercancel", () => {
  if (!drawing) return;

  drawing = false;
  recognizeShape();
});

function addPoint(input, y) {
  if (typeof input === "number") {
    points.push({ x: input, y: y });
  } else {
    points.push({ x: input.clientX, y: input.clientY });
  }
}

function drawLine() {
  if (points.length < 3) return;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.beginPath();
  ctx.moveTo(points[0].x, points[0].y);

  for (let i = 1; i < points.length - 1; i++) {
    const current = points[i];
    const next = points[i + 1];

    const xc = (current.x + next.x) / 2;
    const yc = (current.y + next.y) / 2;

    ctx.quadraticCurveTo(
      current.x,
      current.y,
      xc,
      yc
    );
  }

  ctx.strokeStyle = "#d1d1d1";
  ctx.lineWidth = 3;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.stroke();
}

function distance(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

function pathLength() {
  let len = 0;

  for (let i = 1; i < points.length; i++) {
    len += distance(points[i - 1], points[i]);
  }

  return len;
}

function getBounds() {
  let minX = Infinity;
  let maxX = -Infinity;
  let minY = Infinity;
  let maxY = -Infinity;

  points.forEach(p => {
    minX = Math.min(minX, p.x);
    maxX = Math.max(maxX, p.x);
    minY = Math.min(minY, p.y);
    maxY = Math.max(maxY, p.y);
  });

  return {
    minX,
    maxX,
    minY,
    maxY,
    width: maxX - minX,
    height: maxY - minY
  };
}

function recognizeShape() {
  if (points.length < 2) return;

  const start = points[0];
  const end = points[points.length - 1];
  const len = pathLength();
  const closeDist = distance(start, end);
  const box = getBounds();

  const width = box.width;
  const height = box.height;

  let keyword = "";

  if (len < 90 && width < 90 && height < 90) {
    keyword = "구두";
  }

  else if (
    closeDist < 80 &&
    len > 120 &&
    width > 40 &&
    height > 40 &&
    Math.abs(width - height) < 80
  ) {
    keyword = "권표";
  }

  else if (
    width > 70 &&
    len > 70 &&
    closeDist > 70 &&
    height > 12 &&
    height < width * 0.5
  ) {
    const quarter = points[Math.floor(points.length * 0.25)];
    const middle  = points[Math.floor(points.length * 0.5)];
    const threeQ  = points[Math.floor(points.length * 0.75)];

    const curveSpread =
      Math.abs(middle.y - quarter.y) +
      Math.abs(middle.y - threeQ.y);

    if (curveSpread > 10) {
      keyword = "괄호";
    }
  }

  if (keyword) {
    handleResult(keyword);
  } else {
    showList([], "no result");
  }
}

function handleResult(keyword) {
  const filtered = sheetRows.filter(row =>
    (row[K.cat] || "").includes(keyword)
  );

  showList(shuffleArray(filtered), keyword);
}

function escapeHTML(str) {
  return String(str || "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function imageHTML(src, alt = "") {
  if (!src) return `<div class="no-image">NO PUNCTUATION IMAGE</div>`;
  return `<img class="page-img" src="${escapeHTML(src)}?t=${Date.now()}" alt="${escapeHTML(alt)}" referrerpolicy="no-referrer">`;
}

function showList(list, keyword) {
  result.classList.remove("mark-expand");

  currentList = list;
  currentKeyword = keyword;

  const menuInfo = document.getElementById("menuInfo");

  if (menuInfo) {
    if (keyword === "DRAW MODE") {
      menuInfo.textContent = "마우스로 자유롭게 그려보세요!";
    } else {
      menuInfo.textContent = `${list.length} RESULTS`;
    }
  }

  let html = `${renderPunctuationPanel(keyword)}<div class="top-nav"></div>`;

  if (!list.length) {
    html += `
      <div class="fail">${escapeHTML(keyword)}</div>
      <div class="result-item">
        <div class="result-row">
          <div class="result-name"><span> </span></div>
        </div>
      </div>
    `;

    result.innerHTML = html;
    bindResultRows();
    updateActiveButtons(keyword);
    return;
  }


  html += renderRows(list);

  result.innerHTML = html;
  bindResultRows();
  updateActiveButtons(keyword);
}

function renderInfoCol(label, value) {
  if (!value) return "";

  return `
    <div class="info-col">
      <div class="info-label">${escapeHTML(label)}</div>
      <div class="info-value">${escapeHTML(value)}</div>
    </div>
  `;
}

function renderRows(list) {
  let html = "";

  list.forEach((item, index) => {
    const img = getPunctuationImage(item);
    const captionKr = (item[K.caption] || "").trim();
    const captionEn = (item[K.captionEn] || "").trim();

    html += `
      <div class="result-item" style="animation-delay:${index * 0.055}s">
        <div class="result-row">
          <div class="result-name"><span>${escapeHTML(item[K.name])}</span></div>
          <div class="plus">+</div>
        </div>

        <div class="result-detail">
          <div class="detail-inner">
            <div class="book-spread">
              <div class="page-left">
                <div class="info-cols">
                  ${renderInfoCol("번호", item["번호"])}
                  ${renderInfoCol("이름", item[K.name])}
                  ${renderInfoCol("시대", item[K.period])}
                  ${renderInfoCol("분류", item[K.cat])}
                  ${renderInfoCol("소장처", item[K.coll])}
                  ${renderInfoCol("종이", item[K.paper])}
                  ${renderInfoCol("크기", item[K.size])}

                  <div class="image-description-wrap">
                    <div class="image-description">${escapeHTML(captionKr)}</div>
                    <div class="image-description-en">${escapeHTML(captionEn)}</div>
                  </div>

                 
                </div>

               
              </div>
            </div>
          </div>
        </div>
      </div>
    `;
  });

  return html;
}

function bindResultRows() {
  document.querySelectorAll(".result-name, .plus").forEach(el => {
    el.addEventListener("click", e => {
      e.stopPropagation();

      const itemEl = el.closest(".result-item");
      const wasOpen = itemEl.classList.contains("open");

      // 다른 펼침면 닫기
      document.querySelectorAll(".result-item.open").forEach(openItem => {
        openItem.classList.remove("open");
      });

      // 원래 닫혀 있던 것만 열기
      if (!wasOpen) {
        itemEl.classList.add("open");
      }

      const index = [...document.querySelectorAll(".result-item")].indexOf(itemEl);
      const item = currentList[index];
      const img = item ? getPunctuationImage(item) : "";

      const floatingImg = document.getElementById("panelFloatingImg");

      if (floatingImg && img && itemEl.classList.contains("open")) {
        floatingImg.src = `${img}?t=${Date.now()}`;
        floatingImg.alt = item[K.name];
      } else if (floatingImg) {
        floatingImg.removeAttribute("src");
        floatingImg.alt = "";
      }
    });
  });
}

function playMarkExpandMotion() {
  result.classList.remove("mark-expand");

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      result.classList.add("mark-expand");

  });
}

function resetToDrawMode() {
  currentList = [];
  currentKeyword = "";

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  result.innerHTML = `
    ${renderPunctuationPanel("DRAW MODE")}
    <div class="top-nav"></div>
    <div class="empty-state"></div>
  `;

  updateActiveButtons("DRAW MODE");
  playMarkExpandMotion();
}

function shuffleArray(arr) {
  return [...arr].sort(() => Math.random() - 0.5);
}

function updateActiveButtons(keyword) {
  drawBtn.classList.toggle("active", keyword === "DRAW MODE");
  allBtn.classList.toggle("active", keyword === "ALL");

  filterBtns.forEach(btn => {
    btn.classList.toggle("active", btn.dataset.filter === keyword);
  });
}

    const filtered = sheetRows.filter(row =>
      (row[K.cat] || "").includes(keyword)

});

function toGlyphNumber(n){
  const glyphs = ["⓪","➀","➁","➂","➃","➄","➅","➆","➇","➈"];

  return String(n)
    .split("")
    .map(d => {
      const g = glyphs[Number(d)];

      if(g === "⓪"){
        return '<span class="glyph-zero">⓪</span>';
      }

      return '<span class="glyph-num">' + g + '</span>';
    })
    .join("");
}

function renderInfoPage(){
  const menuWrap = document.getElementById("menuWrap");

  if(menuWrap) menuWrap.style.display = "none";

  result.classList.remove("mark-expand");
  result.innerHTML = "";
  result.style.background = "#fff";
  result.style.overflowX = "auto";
  result.style.overflowY = "auto";
  result.style.padding = "0";
  result.style.left = "210px";
  result.style.touchAction = "auto";

  const infoPage = document.createElement("div");
  infoPage.className = "info-page";

  const header = document.createElement("div");
  header.className = "info-table-header";

  const numHeader = document.createElement("div");
  numHeader.className = "info-num-header";
  numHeader.textContent = "번호";

  const gridHeader = document.createElement("div");
  gridHeader.className = "info-grid info-header";

  ["이름", "분류", "시대", "종이", "크기", "소장처"].forEach(text=>{
    const cell = document.createElement("div");
    cell.textContent = text;
    gridHeader.appendChild(cell);
  });

  header.appendChild(numHeader);
  header.appendChild(gridHeader);
  infoPage.appendChild(header);

  const sortedRows = [...sheetRows].sort((a, b) =>
    (a[K.name] || "").localeCompare((b[K.name] || ""), "ko-KR")
  );

  const grouped = [];

  sortedRows.forEach(row=>{
    const name = row[K.name] || "";
    const last = grouped[grouped.length - 1];

    if(last && last.name === name){
      last.rows.push(row);
    }else{
      grouped.push({
        name,
        rows:[row]
      });
    }
  });

  grouped.forEach((group, index)=>{
    const groupEl = document.createElement("div");
    groupEl.className = "info-table-row";

    const numCell = document.createElement("div");
    numCell.className = "info-num";
    numCell.innerHTML = toGlyphNumber(index + 1);

    const rowsWrap = document.createElement("div");
    rowsWrap.className = "info-rows-wrap";

    group.rows.forEach(row=>{
      const line = document.createElement("div");
      line.className = "info-grid info-row";

      [
        row[K.name],
        row[K.cat],
        row[K.period],
        row[K.paper],
        row[K.size],
        row[K.coll]
      ].forEach(value=>{
        const cell = document.createElement("div");
        cell.textContent = value || "";
        line.appendChild(cell);
      });

      rowsWrap.appendChild(line);
    });

    groupEl.appendChild(numCell);
    groupEl.appendChild(rowsWrap);
    infoPage.appendChild(groupEl);
  });

  result.appendChild(infoPage);
}

  result.style.padding = "";
