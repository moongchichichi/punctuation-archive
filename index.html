<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>한국의 옛 문장부호 아카이브</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500;700&display=swap');

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#f3f3f3;
  color:#000;
  font-family:"Noto Serif KR",serif;
}

body{
  cursor:none;
}

#cursor{
  position:fixed;
  width:16px;
  height:16px;
  border:1px solid #000;
  border-radius:50%;
  pointer-events:none;
  z-index:9999;
  transform:translate(-50%,-50%);
  transition:.18s ease;
}

#cursor.big{
  width:42px;
  height:42px;
  background:rgba(0,0,0,.05);
}

.page{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
}

/* 캔버스 */
#canvas{
  position:absolute;
  inset:0;
  z-index:1;
}

/* 메뉴 */
.menu{
  position:relative;
  z-index:5;
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:30px;
  pointer-events:none;
}

.link{
  position:relative;
  display:block;
  text-decoration:none;
  pointer-events:auto;
  font-size:clamp(3rem,8vw,5rem);
  font-weight:300;
  line-height:1;
  letter-spacing:-.08em;
  color:#000000;
  mix-blend-mode:screen;
  transition:
    transform .4s cubic-bezier(.22,1,.36,1),
    letter-spacing .4s cubic-bezier(.22,1,.36,1);
}

.link:hover{
  transform:scale(1.04);
  letter-spacing:-.04em;
}

/* 하단 설명 */
.info{
  position:absolute;
  left:18px;
  bottom:16px;
  z-index:6;
  width:min(720px,90vw);
  font-size:.82rem;
  line-height:1.2;
  letter-spacing:-.03em;
  color:#000;
}

/* 모바일 */
@media(max-width:760px){
  body{ cursor:auto; }
  #cursor{ display:none; }
  .link{ font-size:clamp(3rem,15vw,5rem); }
  .info{ left:10px; right:10px; bottom:10px; font-size:.72rem; }
}
</style>
</head>

<body>

<div id="cursor"></div>

<main class="page">

  <canvas id="canvas"></canvas>

  <nav class="menu">
    <a href="5.9.html" class="link" id="link1">서재탐색</a>
    <a href="collage.html" class="link" id="link2">문장부호</a>
  </nav>

  <p class="info">
    한국의 옛 문장부호 아카이브는 책 이미지와 문장부호를 함께 탐색하고,
    문장부호 자체를 중심으로 분류·비교하는 온라인 타이포그래피 아카이브입니다.
  </p>

</main>

<script>
/* ── 커서 ── */
const cursor = document.getElementById("cursor");
window.addEventListener("mousemove", e => {
  cursor.style.left = e.clientX + "px";
  cursor.style.top  = e.clientY + "px";
  cursor.classList.toggle("big", !!e.target.closest(".link"));
});

/* ── 캔버스 설정 ── */
const canvas = document.getElementById("canvas");
const ctx    = canvas.getContext("2d");

const marks   = ["、","。","◇","◯","︵","︶","︷","︸"];
const FONT_SIZE = 22;
const COL_W     = 32;   // 열 간격 (px)
const ROW_H     = 32;   // 행 간격 (px)
const BASE_SPEED = 1.8; // 기본 이동 속도 (px/frame)

let cols, rows, grid, heads, forbidden;

/* 메뉴 텍스트의 bounding rect + 여백을 금지 구역으로 반환 */
function getForbiddenRects() {
  const PAD = 15;
  return ["link1","link2"]
    .map(id => document.getElementById(id))
    .filter(Boolean)
    .map(el => {
      const r = el.getBoundingClientRect();
      return { x: r.left - PAD, y: r.top - PAD, w: r.width + PAD*2, h: r.height + PAD*2 };
    });
}

/* 셀 (col, row) 의 중심이 금지 구역 안에 있는지 */
function isForbidden(c, r) {
  const px = c * COL_W + COL_W / 2;
  const py = r * ROW_H + ROW_H / 2;
  for (const rect of forbidden) {
    if (px >= rect.x && px <= rect.x + rect.w &&
        py >= rect.y && py <= rect.y + rect.h) return true;
  }
  return false;
}

function randomMark() {
  return marks[Math.floor(Math.random() * marks.length)];
}

/* 전체 초기화 */
function init() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
  cols     = Math.ceil(canvas.width  / COL_W) + 4;
  rows     = Math.ceil(canvas.height / ROW_H);
  forbidden = getForbiddenRects();

  grid  = [];
  heads = [];

  for (let r = 0; r < rows; r++) {
    grid[r] = [];
    for (let c = 0; c < cols; c++) {
      const blocked = isForbidden(c, r);
      grid[r][c] = {
        char:    randomMark(),
        base:    blocked ? 0 : (Math.random() * 0.18 + 0.05), // 기본 투명도
        blocked: blocked
      };
    }
    /* 각 행마다 타이핑 헤드를 랜덤 위치에서 시작 */
    heads.push({
      row:   r,
      x:     -Math.random() * cols * COL_W,       // 시작 x (화면 왼쪽 바깥)
      speed: BASE_SPEED * (0.65 + Math.random() * 0.75)
    });
  }
}

/* ── 메인 루프 ── */
let lastTime = null;

function draw(ts) {
  if (!lastTime) lastTime = ts;
  const dt = Math.min((ts - lastTime) / 16.67, 3); // 배속 상한
  lastTime = ts;

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.font         = `300 ${FONT_SIZE}px "Noto Serif KR", serif`;
  ctx.textBaseline = "middle";

  for (let r = 0; r < rows; r++) {
    const head = heads[r];
    head.x += head.speed * dt;

    /* 헤드 열 인덱스 */
    const headCol = Math.floor(head.x / COL_W);

    for (let c = 0; c < cols; c++) {
      const cell = grid[r][c];
      if (cell.blocked) continue;

      const px   = c * COL_W + COL_W / 2;
      const py   = r * ROW_H + ROW_H / 2;
      const dist = headCol - c; // 헤드와의 열 거리 (양수 = 헤드가 오른쪽에)

      let alpha;

      if (dist === 0) {
        /* 헤드 위치 : 가장 밝고 글자도 교체 */
        if (Math.random() < 0.15 * dt) {
          cell.char = randomMark();
        }
        alpha = 0.88;
      } else if (dist > 0 && dist <= 4) {
        /* 헤드 직후 (이미 지나간 곳) : 서서히 어두워짐 */
        alpha = 0.5 - (dist - 1) * 0.1;
      } else if (dist < 0 && dist >= -2) {
        /* 헤드 직전 (아직 안 지나간 곳) : 희미하게 예열 */
        alpha = 0.08 + (2 + dist) * 0.04;
      } else {
        /* 나머지 : 기본 투명도 */
        alpha = cell.base;
      }

      ctx.fillStyle = `rgba(0,0,0,${alpha.toFixed(3)})`;
      ctx.fillText(cell.char, px, py);
    }

    /* 헤드가 화면 끝을 넘어가면 처음부터 재시작 */
    if (head.x > (cols + 2) * COL_W) {
      head.x = -(COL_W * (2 + Math.floor(Math.random() * 6)));
      /* 글자 리셋 */
      for (let c = 0; c < cols; c++) {
        if (!grid[r][c].blocked) {
          grid[r][c].char = randomMark();
          grid[r][c].base = Math.random() * 0.18 + 0.05;
        }
      }
    }
  }

  requestAnimationFrame(draw);
}

/* ── 시작 ── */
function start() {
  init();
  requestAnimationFrame(draw);
}

/* 폰트 로드 후 시작 (금지 구역 계산을 위해 레이아웃 완성 필요) */
if (document.readyState === "complete") {
  setTimeout(start, 150);
} else {
  window.addEventListener("load", () => setTimeout(start, 150));
}

window.addEventListener("resize", () => { init(); });
</script>

</body>
</html>
