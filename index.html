<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>한국의 옛 문장부호 아카이브</title>

<style>
@font-face {
  font-family: 'OnulSamhwamyeongjo';
  src: url('./OnulSamhwamyeongjo-Regular.woff') format('woff');
  font-weight: 300;
  font-style: normal;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#f3f3f3;
  color:#000;
  font-family:"OnulSamhwamyeongjo", serif;
}

body{
  cursor:none;
}

#cursor{
  position:fixed;
  width:16px;
  height:16px;
  border:1px solid #000;
  border-radius:50%;
  pointer-events:none;
  z-index:9999;
  transform:translate(-50%,-50%);
  transition:width .18s ease, height .18s ease, background .18s ease;
}

#cursor.big{
  width:42px;
  height:42px;
  background:rgba(0,0,0,.05);
}

.page{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
}

#canvas{
  position:absolute;
  inset:0;
  z-index:1;
}

.menu{
  position:relative;
  font-size: 2rem;
  z-index:5;
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:40px;
  pointer-events:none;
  letter-spacing: 2rem;
}

.link{
  position:relative;
  display:block;
  text-decoration:none;
  pointer-events:auto;
  font-size:clamp(2rem,8vw,2rem);
  font-weight:300;
  line-height:1;
  letter-spacing:.5em;
  color:#000;
  mix-blend-mode:screen;
  transition:
    transform .4s cubic-bezier(.22,1,.36,1),
    letter-spacing .4s cubic-bezier(.22,1,.36,1);
}

.link:hover{
  transform:scale(1.04);
  border-bottom:1px solid #000;
}

/* 하단 정보 전체 */
.bottom-info{
  position:absolute;
  left:18px;
  bottom:16px;
  z-index:6;

  display:grid;
  grid-template-columns: 520px 930px;
  gap:18px;
  align-items:start;

  height:50px;
  overflow:hidden;

  border-top:1px solid #000;


  color:#000;
}

/* 왼쪽 기본 설명 */
.info{
  width:520px;
  height:72px;

  font-size:.82rem;
  line-height:1.6;
  letter-spacing:-.03em;
  padding-left:8px;
  padding-top: 4px;
  overflow:hidden;
}

/* 오른쪽 hover 설명 */
.hover-info{
  width:500px;
  height:72px;

  font-size:.82rem;
  line-height:1.7;
  letter-spacing:-.03em;

  padding-top: 3px;

  overflow:hidden;
  word-break:keep-all;
  overflow-wrap:break-word;
}

/* 모바일 */
@media(max-width:760px){
  body{
    cursor:auto;
  }

  #cursor{
    display:none;
  }

  .link{
    font-size:clamp(3rem,15vw,5rem);
  }

  .bottom-info{
    left:10px;
    right:10px;
    bottom:10px;

    grid-template-columns: 1fr 120px;
    gap:10px;

    height:72px;
  }

  .info{
    width:auto;
    height:72px;
    font-size:.72rem;
  }

  .hover-info{
    width:300px;
    height:72px;
    font-size:.72rem;
  }
}
</style>
</head>

<body>

<div id="cursor"></div>

<main class="page">

  <canvas id="canvas"></canvas>

  <nav class="menu">
    <a href="5.9.html" class="link" id="link1">서재탐색</a>
    <a href="collage.html" class="link" id="link2">문장부호 검색</a>
  </nav>

  <div class="bottom-info">
    <p class="info">
      한국의 옛 문장부호 아카이브는 책 이미지와 문장부호를 함께 탐색하고,<br>
      문장부호 자체를 중심으로 분류·비교하는 온라인 타이포그래피 아카이브입니다.
    </p>

    <p class="hover-info" id="hoverInfo"></p>
  </div>

</main>

<script>
/* ── 커서 ── */
const cursor = document.getElementById("cursor");

let mouseX = 0;
let mouseY = 0;
let cursorBusy = false;

window.addEventListener("mousemove", e => {
  mouseX = e.clientX;
  mouseY = e.clientY;

  if (!cursorBusy) {
    cursorBusy = true;

    requestAnimationFrame(() => {
      cursor.style.left = mouseX + "px";
      cursor.style.top  = mouseY + "px";

      const target = document.elementFromPoint(mouseX, mouseY);
      cursor.classList.toggle("big", !!target?.closest(".link"));

      cursorBusy = false;
    });
  }
});

/* ── 링크 호버 정보 ── */
const hoverInfo = document.getElementById("hoverInfo");
const link1 = document.getElementById("link1");
const link2 = document.getElementById("link2");

function setHoverInfo(text) {
  hoverInfo.textContent = text;
}

link1.addEventListener("mouseenter", () => {
  setHoverInfo("서재를 탐색하듯 책의 정보를 중심으로 구성되어 있습니다. 사용자는 책의 제목, 문장부호, 시대적 맥락을 따라가며 자료를 탐색할 수 있다.");
});

link2.addEventListener("mouseenter", () => {
  setHoverInfo("문장부호의 형태를 직접 그려보며 탐색할 수 있습니다. 키워드 입력 대신 손으로 기호를 재현하는 행위는, 이전의 흔적과 필기 감각을 디지털 환경 안에서 다시 불러옵니다.");
});

link1.addEventListener("mouseleave", () => {
  setHoverInfo("");
});

link2.addEventListener("mouseleave", () => {
  setHoverInfo("");
});

/* ── 캔버스 설정 ── */
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d", { alpha:true });

const marks = ["、","。","◇","◯","︵","︶","︷","︸"];

const FONT_SIZE = 22;
const COL_W = 40;
const ROW_H = 40;
const BASE_SPEED = 1.25;
const DPR_LIMIT = 1.25;

let dpr = 1;
let cols, rows, grid, heads, forbidden;
let resizeTimer = null;

function getForbiddenRects() {
  const PAD = 18;

  return ["link1","link2"]
    .map(id => document.getElementById(id))
    .filter(Boolean)
    .map(el => {
      const r = el.getBoundingClientRect();

      return {
        x: r.left - PAD,
        y: r.top - PAD,
        w: r.width + PAD * 2,
        h: r.height + PAD * 2
      };
    });
}

function isForbidden(c, r) {
  const px = c * COL_W + COL_W / 2;
  const py = r * ROW_H + ROW_H / 2;

  for (const rect of forbidden) {
    if (
      px >= rect.x &&
      px <= rect.x + rect.w &&
      py >= rect.y &&
      py <= rect.y + rect.h
    ) {
      return true;
    }
  }

  return false;
}

function randomMark() {
  return marks[(Math.random() * marks.length) | 0];
}

function init() {
  dpr = Math.min(window.devicePixelRatio || 1, DPR_LIMIT);

  const w = window.innerWidth;
  const h = window.innerHeight;

  canvas.width = Math.floor(w * dpr);
  canvas.height = Math.floor(h * dpr);
  canvas.style.width = w + "px";
  canvas.style.height = h + "px";

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  cols = Math.ceil(w / COL_W) + 3;
  rows = Math.ceil(h / ROW_H);

  forbidden = getForbiddenRects();

  grid = [];
  heads = [];

  for (let r = 0; r < rows; r++) {
    grid[r] = [];

    for (let c = 0; c < cols; c++) {
      const blocked = isForbidden(c, r);

      grid[r][c] = {
        char: randomMark(),
        base: blocked ? 0 : Math.random() * 0.12 + 0.04,
        blocked
      };
    }

    heads.push({
      row: r,
      x: -Math.random() * cols * COL_W,
      speed: BASE_SPEED * (0.65 + Math.random() * 0.65)
    });
  }
}

/* ── 메인 루프 ── */
let lastTime = null;
let frameSkip = 0;

function draw(ts) {
  requestAnimationFrame(draw);

  frameSkip++;
  if (frameSkip % 2 !== 0) return;

  if (!lastTime) lastTime = ts;

  const dt = Math.min((ts - lastTime) / 16.67, 3);
  lastTime = ts;

  ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

  ctx.font = `300 ${FONT_SIZE}px "Noto Serif KR", serif`;
  ctx.textBaseline = "middle";
  ctx.textAlign = "center";

  for (let r = 0; r < rows; r++) {
    const head = heads[r];
    head.x += head.speed * dt;

    const headCol = Math.floor(head.x / COL_W);

    for (let c = 0; c < cols; c++) {
      const cell = grid[r][c];

      if (cell.blocked) continue;

      const px = c * COL_W + COL_W / 2;
      const py = r * ROW_H + ROW_H / 2;
      const dist = headCol - c;

      let alpha;

      if (dist === 0) {
        if (Math.random() < 0.08 * dt) {
          cell.char = randomMark();
        }

        alpha = 0.78;
      } else if (dist > 0 && dist <= 3) {
        alpha = 0.42 - (dist - 1) * 0.1;
      } else if (dist < 0 && dist >= -1) {
        alpha = 0.08;
      } else {
        alpha = cell.base;
      }

      ctx.fillStyle = `rgba(0,0,0,${alpha.toFixed(3)})`;
      ctx.fillText(cell.char, px, py);
    }

    if (head.x > (cols + 2) * COL_W) {
      head.x = -(COL_W * (2 + Math.floor(Math.random() * 6)));

      for (let c = 0; c < cols; c++) {
        const cell = grid[r][c];

        if (!cell.blocked) {
          cell.char = randomMark();
          cell.base = Math.random() * 0.12 + 0.04;
        }
      }
    }
  }
}

function start() {
  init();
  requestAnimationFrame(draw);
}

if (document.readyState === "complete") {
  setTimeout(start, 150);
} else {
  window.addEventListener("load", () => setTimeout(start, 150));
}

window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);

  resizeTimer = setTimeout(() => {
    lastTime = null;
    init();
  }, 180);
});
</script>

</body>
</html>
