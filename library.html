<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>내 서재</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500;700;900&family=Noto+Sans+KR:wght@300;400;500;700;900&family=Noto+Serif+JP:wght@400;500;700&display=swap');

@font-face {
  font-family: 'OnulSamhwamyeongjo';
  src: url('./OnulSamhwamyeongjo-Regular.woff') format('woff');
  font-weight: 300;
  font-style: normal;
}

#topbar,
#home-btn,
#library-btn{
  display:none;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #d8d8d800;
  color: #000;
  font-family: "Noto Serif KR", serif;
}

#app {
  position: fixed;
  inset: 0;
}

#topbar {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 8px;
  padding: 0 14px 0 240px;
  background: rgba(255,255,255,.96);
  backdrop-filter: blur(10px);
  z-index: 9999;
  border-bottom: 1.5px solid #000;
}

button {
  appearance: none;
  -webkit-appearance: none;
  border: none;
  border-top: 1.5px solid #595959;
  border-bottom: 1.5px solid transparent;
  background: transparent;
  font-family: 'OnulSamhwamyeongjo', serif;
  font-size: 1rem;
  font-weight: 300;
  letter-spacing: .05em;
  cursor: pointer;
}

button:hover,
button.active {
  border-bottom: 1.5px solid #595959;
}

.mode-btn {
  height: 33px;
}

#refresh-btn {
  width: 40px;
  height: 33px;
  font-size: 22px;
  line-height: 1;
}

#home-btn,
#library-btn {
  position: fixed;
  top: 12px;
  width: 100px;
  height: 33px;
  z-index: 10000;
}

#home-btn {
  left: 14px;
}

#library-btn {
  left: 122px;
}

#scroll {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: row;
  overflow-x: auto;
  overflow-y: hidden;
  background: #ffffff;
  scrollbar-width: none;
}

#scroll::-webkit-scrollbar {
  display: none;
}

.empty-message {
  font-family: 'OnulSamhwamyeongjo', serif;
  font-size: 1.2rem;
  letter-spacing: .05em;
  padding: 32px;
  color: #ffffff00;
}

.item-wrapper {
  position: relative;
  height: 100%;
  flex-shrink: 0;
  width: 49px;
  transition: width .6s linear;
  background: #fff;
}

.item-wrapper.open {
  width: 819px;
}

.item-main {
  position: absolute;
  top: 0;
  left: 0;
  width: 49px;
  height: 100%;
  background: #fff;
  overflow: hidden;
  z-index: 3;
  cursor: pointer;
}

.name-col {
  width: 49px;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 18px 7px 0;
}

.name-text {
  writing-mode: vertical-rl;
  font-family: "Noto Serif KR", serif;
  font-size: 26px;
  font-weight: 400;
  line-height: 1.2;
  letter-spacing: .08em;
}

.jp-comma {
  font-family: "Noto Serif JP", serif;
  font-size: .92em;
  display: inline-block;
  letter-spacing: -.7em;
}

.item-detail {
  position: absolute;
  top: 0;
  left: 49px;
  width: 770px;
  height: 100%;
  background: #fff;
  overflow-y: auto;
  overflow-x: hidden;
  scrollbar-width: none;
  padding-bottom: 300px;
  border-left: 1.5px solid #828282;
  border-right: 1.5px solid #838383;
  opacity: 0;
  visibility: hidden;
  transition: opacity .4s linear, visibility 0s linear .4s;
}

.item-detail::-webkit-scrollbar {
  display: none;
}

.item-wrapper.open .item-detail {
  opacity: 1;
  visibility: visible;
  transition: opacity .4s linear;
}

.book-spread {
  width: 770px;
  min-height: 100%;
  background: #fff;
  font-family: "Noto Sans KR", sans-serif;
}

.page-left {
  width: 100%;
  min-height: 100%;
  display: grid;
  grid-template-columns: 150px 1fr;
  gap: 24px;
  align-items: start;
  padding: 28px 28px 220px;
  position: relative;
}

.info-cols {
  width: 150px;
  height: 100%;
  display: flex;
  flex-direction: column;
  gap: 9px;
  position: relative;
}

.info-cols::before {
  content: "";
  position: absolute;
  top: -10px;
  left: -6px;
  width: 720px;
  height: 2px;
  background: #767676;
}

.info-col,
.image-description-wrap,
.page-img {
  opacity: 0;
  transition: opacity .35s linear;
}

.item-wrapper.open .info-col,
.item-wrapper.open .image-description-wrap,
.item-wrapper.open .page-img {
  opacity: 1;
  transition-delay: .35s;
}

.info-col {
  display: grid;
  grid-template-columns: 42px 1fr;
  gap: 10px;
  align-items: start;
}

.info-label,
.info-value {
  font-family: "Noto Sans KR", sans-serif;
  font-size: .72rem;
  font-weight: 400;
  line-height: 1.55;
  letter-spacing: .04em;
  word-break: break-all;
}

.info-label {
  transform: translateX(-6px);
}

.image-area {
  display: flex;
  justify-content: flex-end;
}

.page-img {
  width: 480px;
  height: 400px;
  transform: translateY(5px);
  object-fit: cover;
  filter: grayscale(1) contrast(1.12) brightness(.92) saturate(0) sepia(.08);
}

.image-description-wrap {
  position: absolute;
  left: -5px;
  top: 450px;
  width: 720px;
  display: grid;
  grid-template-columns: 340px 340px;
  gap: 40px;
  align-items: start;
  line-height: 2;
  border-top: 2px solid #818181;
  border-bottom: 2px solid #767676;
  padding-top: 4px;
  padding-bottom: 6px;
}

.image-description-wrap::before {
  content: "한글 설명";
  position: absolute;
  left: 0;
  bottom: 100%;
  width: 380px;
  height: 22px;
  transform: translateY(-8px);
  border-top: 2px solid #818181;
  font-size: .8rem;
}

.image-description-wrap::after {
  content: "English Description";
  position: absolute;
  left: 380px;
  bottom: 100%;
  width: 340px;
  height: 22px;
  transform: translateY(-8px);
  border-top: 2px solid #818181;
  font-size: .9rem;
}

.image-description,
.image-description-en {
  width: 340px;
  max-width: 340px;
  color: #000;
  word-break: keep-all;
  overflow-wrap: break-word;
}

.image-description {
  font-family: "Noto Sans KR", sans-serif;
  font-size: .9rem;
  line-height: 2;
  letter-spacing: .05em;
}

.image-description-en {
  font-family: "Helvetica Neue", Arial, sans-serif;
  font-size: 1rem;
  line-height: 1.6;
  letter-spacing: .03em;
}
</style>
</head>

<body>
<div id="app">

  <div id="scroll"></div>
</div>

<script>
const K = {
  no: "번호",
  name: "이름",
  cat: "분류",
  period: "시대",
  paper: "종이",
  size: "크기",
  coll: "소장처",
  caption: "caption",
  captionEn: "caption-en",
  punctImg: "UL-Punctuation",
  bookImg: "UL-Images"
};

const LIBRARY_STORAGE_KEY = "myLibraryBooks";

let currentMode = "punct";
let allRows = [];
let allWrappers = [];
let openIdx = -1;

function getBookId(row) {
  return [row[K.no], row[K.name], row[K.period]].filter(Boolean).join("|");
}

function getLibraryBooks() {
  try {
    return JSON.parse(localStorage.getItem(LIBRARY_STORAGE_KEY) || "[]");
  } catch (e) {
    console.error(e);
    return [];
  }
}

function shuffleArray(arr) {
  const a = [...arr];

  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }

  return a;
}

function getCurrentImage(row) {
  if (currentMode === "book") {
    return row[K.bookImg] || row[K.punctImg] || "";
  }

  return row[K.punctImg] || "";
}

function formatTitle(title) {
  return String(title || "")
    .replaceAll(",", '<span class="jp-comma">、</span>')
    .replaceAll("、", '<span class="jp-comma">、</span>')
    .replaceAll("。", '<span class="jp-comma">。</span>');
}

function createInfoCol(label, value) {
  if (!value) return null;

  const col = document.createElement("div");
  col.className = "info-col";

  const lbl = document.createElement("div");
  lbl.className = "info-label";
  lbl.textContent = label;

  const val = document.createElement("div");
  val.className = "info-value";
  val.textContent = value;

  col.appendChild(lbl);
  col.appendChild(val);

  return col;
}

function buildList(rows) {
  allRows = shuffleArray(rows.filter(row => row[K.name]));

  const scroll = document.getElementById("scroll");
  scroll.innerHTML = "";


  allWrappers = [];
  openIdx = -1;

  allRows.forEach((row, idx) => {
    const wrapper = document.createElement("div");
    wrapper.className = "item-wrapper";

    const main = document.createElement("div");
    main.className = "item-main";

    const nameCol = document.createElement("div");
    nameCol.className = "name-col";

    const nameText = document.createElement("span");
    nameText.className = "name-text";
    nameText.innerHTML = formatTitle(row[K.name]);

    nameCol.appendChild(nameText);
    main.appendChild(nameCol);

    main.addEventListener("click", () => {
      toggleItem(idx);
    });

    const detail = document.createElement("div");
    detail.className = "item-detail";

    const spread = document.createElement("div");
    spread.className = "book-spread";

    const pageLeft = document.createElement("div");
    pageLeft.className = "page-left";

    const infoCols = document.createElement("div");
    infoCols.className = "info-cols";

    [
      { key: K.no, label: "번호" },
      { key: K.name, label: "이름" },
      { key: K.period, label: "시대" },
      { key: K.cat, label: "분류" },
      { key: K.coll, label: "소장처" },
      { key: K.paper, label: "종이" },
      { key: K.size, label: "크기" }
    ].forEach(item => {
      const col = createInfoCol(item.label, row[item.key]);
      if (col) infoCols.appendChild(col);
    });

    const captionKr = (row[K.caption] || "").trim();
    const captionEn = (row[K.captionEn] || "").trim();

    if (captionKr || captionEn) {
      const descWrap = document.createElement("div");
      descWrap.className = "image-description-wrap";

      const descKr = document.createElement("div");
      descKr.className = "image-description";
      descKr.textContent = captionKr;

      const descEn = document.createElement("div");
      descEn.className = "image-description-en";
      descEn.textContent = captionEn;

      descWrap.appendChild(descKr);
      descWrap.appendChild(descEn);
      infoCols.appendChild(descWrap);
    }

    const imageArea = document.createElement("div");
    imageArea.className = "image-area";

    const img = document.createElement("img");
    img.className = "page-img";
    img.alt = row[K.name] || "";

    imageArea.appendChild(img);

    pageLeft.appendChild(infoCols);
    pageLeft.appendChild(imageArea);

    spread.appendChild(pageLeft);
    detail.appendChild(spread);

    wrapper.appendChild(main);
    wrapper.appendChild(detail);

    scroll.appendChild(wrapper);

    allWrappers.push(wrapper);
  });
}

function toggleItem(idx) {
  const wrapper = allWrappers[idx];
  const isOpen = wrapper.classList.contains("open");

  if (openIdx >= 0 && openIdx !== idx) {
    closeItem(openIdx);
  }

  if (isOpen) {
    closeItem(idx);
    openIdx = -1;
    return;
  }

  wrapper.classList.add("open");

  const img = wrapper.querySelector(".page-img");
  const src = getCurrentImage(allRows[idx]);

  if (src) {
    img.src = src;
  }

  openIdx = idx;
}

function closeItem(idx) {
  const wrapper = allWrappers[idx];
  const img = wrapper.querySelector(".page-img");

  wrapper.classList.remove("open");

  setTimeout(() => {
    if (!wrapper.classList.contains("open")) {
      img.src = "";
    }
  }, 500);
}

document.querySelectorAll(".mode-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".mode-btn").forEach(b => {
      b.classList.remove("active");
    });

    btn.classList.add("active");
    currentMode = btn.dataset.mode;

    if (openIdx >= 0) {
      const img = allWrappers[openIdx].querySelector(".page-img");
      img.src = getCurrentImage(allRows[openIdx]);
    }
  });
});


const savedRows = getLibraryBooks();

if (savedRows.length) {
  buildList(savedRows);
} else {
  const scroll = document.getElementById("scroll");
  scroll.style.background = "#d8d8d8";
  scroll.innerHTML = `
    <div class="empty-message">
      아직 내 서재에 저장한 책이 없습니다.
    </div>
  `;
}
</script>
</body>
</html>
