<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>문장부호 인식 + 카메라 드로잉</title>

<style>
* {
  box-sizing: border-box;
  user-select: none;
  -webkit-user-select: none;
}

body {
  margin: 0;
  background: white;
  color: black;
  font-family: "Times New Roman", "Didot", "Bodoni 72", serif;
  overflow: hidden;
}

canvas {
  position: fixed;
  left: 0;
  top: 0;
  display: block;
}

#webcam {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  object-fit: cover;
  transform: scaleX(-1);
  z-index: 1;
  display: none;
  opacity: 0.75;
}

body.camera-mode #webcam {
  display: block;
}

body.camera-mode #bgCanvas {
  display: none;
}

#bgCanvas {
  z-index: 0;
  background: white;
}

#drawCanvas {
  z-index: 5;
  pointer-events: none;
  background: transparent;
}

#result {
  position: fixed;
  inset: 0;
  z-index: 2;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 0 20px 80px;
  background: rgba(255, 255, 255, 0.12);
  mix-blend-mode: multiply;
  touch-action: none;
}

#cameraBtn {
  position: fixed;
  right: 20px;
  top: 20px;
  z-index: 30;
  border: 1px solid black;
  background: white;
  color: black;
  font-family: Arial, sans-serif;
  font-size: 14px;
  padding: 10px 14px;
  cursor: pointer;
}

#cameraGuide {
  position: fixed;
  right: 20px;
  top: 66px;
  z-index: 30;
  width: 230px;
  background: rgba(255,255,255,0.9);
  border: 1px solid black;
  padding: 10px;
  font-family: Arial, sans-serif;
  font-size: 13px;
  line-height: 1.35;
  display: none;
}

body.camera-mode #cameraGuide {
  display: block;
}

.top-nav {
  display: flex;
  align-items: flex-end;
  border-bottom: 2px solid black;
  padding-bottom: 10px;
}

.top-nav span {
  font-size: clamp(60px, 10vw, 180px);
  line-height: 0.85;
  letter-spacing: -0.02em;
  font-weight: 100;
}

.empty-state {
  height: calc(100vh - 160px);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: clamp(42px, 8vw, 120px);
  letter-spacing: -0.08em;
  pointer-events: none;
}

.keyword-header {
  display: grid;
  grid-template-columns: 38% minmax(140px, 28vw);
  align-items: center;
  border-bottom: 1px solid black;
  min-height: 92px;
  pointer-events: none;
}

.keyword-title {
  font-size: clamp(60px, 7vw, 70px);
  line-height: 0.8;
  letter-spacing: -0.08em;
}

.keyword-info {
  font-size: clamp(50px, 2.5vw, 50px);
  line-height: 1;
  font-weight: 100;
  letter-spacing: -0.06em;
}

.result-item {
  border-bottom: 1px solid black;
}

.result-row {
  display: grid;
  grid-template-columns: 38% minmax(140px, 28vw) 70px;
  align-items: center;
  min-height: 56px;
  cursor: default;
}

.result-name {
  grid-column: 2;
  height: 32px;
  display: flex;
  align-items: center;
  overflow: hidden;
  background: rgba(255,255,255,0.72);
  color: black;
  padding: 0 8px;
  font-size: clamp(32px, 2.5vw, 32px);
  line-height: 1;
  letter-spacing: -0.05em;
  white-space: nowrap;
  cursor: pointer;
}

.result-name span {
  display: inline-block;
  white-space: nowrap;
  padding-right: 60px;
}

.result-name:hover span {
  animation: slideTitle 5s linear infinite alternate;
}

@keyframes slideTitle {
  from { transform: translateX(0); }
  to { transform: translateX(-60%); }
}

.plus {
  grid-column: 3;
  font-size: 64px;
  font-weight: 50;
  line-height: 1;
  text-align: right;
  transition: transform 0.35s ease;
  cursor: pointer;
}

.result-item.open .plus {
  transform: rotate(45deg);
}

.result-detail {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.55s ease, padding 0.55s ease;
}

.result-item.open .result-detail {
  max-height: 70vh;
  padding: 18px 0 26px;
}

.detail-inner {
  display: grid;
  grid-template-columns: minmax(140px, 240px) 1fr;
  gap: 24px;
  padding-left: 38%;
  align-items: start;
}

.detail-inner img {
  width: 100%;
  max-height: 260px;
  object-fit: cover;
  filter: grayscale(1) contrast(1.2);
}

.detail-text {
  font-family: Arial, sans-serif;
  font-size: 17px;
  line-height: 1;
  letter-spacing: -0.02em;
  user-select: text;
  -webkit-user-select: text;
}

.result-item.open .detail-text {
  writing-mode: vertical-rl;
  text-orientation: mixed;
  height: 320px;
  overflow-x: auto;
  overflow-y: hidden;
}

.detail-text div {
  border-bottom: 1px solid rgba(0,0,0,0.35);
  padding: 0;
}

.result-item.open .detail-text div {
  border-bottom: none;
  border-left: 0px solid rgba(0,0,0,0.35);
  padding: 0 3px;
}

.fail {
  font-size: clamp(54px, 9vw, 132px);
  line-height: 0.9;
  letter-spacing: -0.08em;
  border-bottom: 1px solid black;
  padding: 28px 0;
  pointer-events: none;
}
</style>
</head>

<body>

<video id="webcam" autoplay playsinline muted></video>

<canvas id="bgCanvas"></canvas>
<canvas id="drawCanvas"></canvas>

<button id="cameraBtn">CAMERA DRAW</button>
<div id="cameraGuide">
  엄지와 검지를 붙이면 그리기 시작<br>
  손가락을 떼면 인식 실행<br><br>
  점 = 구두<br>
  원 = 권표<br>
  가로 곡선 = 괄호
</div>

<div id="result">
  <div class="top-nav">
    <span>(。。。。。。。) ● ○ ◎ ◉ </span>
  </div>
  <div class="empty-state">DRAW MODE</div>
</div>

<script type="module">
import {
  HandLandmarker,
  FilesetResolver
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest";

const SPREADSHEET_ID = "1lgA52QAg3-tIM07LVgSJVRmOwjbXmUeWfJ1xou-IE2Y";
const GID = "2070526780";
const CSV_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/export?format=csv&gid=${GID}`;

const K = {
  name: "이름",
  cat: "분류",
  period: "시대",
  paper: "종이",
  size: "크기",
  coll: "소장처",
  img: "UL-Images",
  sym: "UL-Punctuation"
};

const IMAGE_COUNT = 260;
const IMAGE_LOAD_COUNT = 100;

const video = document.getElementById("webcam");
const cameraBtn = document.getElementById("cameraBtn");

const bgCanvas = document.getElementById("bgCanvas");
const bgCtx = bgCanvas.getContext("2d");

const canvas = document.getElementById("drawCanvas");
const ctx = canvas.getContext("2d");

const result = document.getElementById("result");

let drawing = false;
let points = [];
let sheetRows = [];
let loadedImages = [];

let cameraMode = false;
let cameraReady = false;
let handLandmarker = null;
let lastVideoTime = -1;

function resizeCanvas() {
  bgCanvas.width = window.innerWidth;
  bgCanvas.height = window.innerHeight;
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  if (loadedImages.length && !cameraMode) drawRandomBackground();
}

window.addEventListener("resize", resizeCanvas);
resizeCanvas();

function parseCSV(text) {
  const rows = [];
  let row = [];
  let cur = "";
  let quote = false;

  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    const next = text[i + 1];

    if (ch === '"' && quote && next === '"') {
      cur += '"';
      i++;
    } else if (ch === '"') {
      quote = !quote;
    } else if (ch === "," && !quote) {
      row.push(cur);
      cur = "";
    } else if ((ch === "\n" || ch === "\r") && !quote) {
      if (cur || row.length) {
        row.push(cur);
        rows.push(row);
        row = [];
        cur = "";
      }
      if (ch === "\r" && next === "\n") i++;
    } else {
      cur += ch;
    }
  }

  if (cur || row.length) {
    row.push(cur);
    rows.push(row);
  }

  const headers = rows.shift();

  return rows.map(r =>
    Object.fromEntries(
      headers.map((h, i) => [h.trim(), r[i]?.trim() || ""])
    )
  );
}

function extractImageUrls(value) {
  if (!value) return [];

  return value
    .split(/\s*,\s*|\s*\n\s*/)
    .map(v => v.trim())
    .filter(v => v.startsWith("http"));
}

function loadImage(src) {
  return new Promise(resolve => {
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => resolve(img);
    img.onerror = () => resolve(null);
    img.src = src;
  });
}

async function loadSheet() {
  const csvText = await fetch(CSV_URL).then(r => r.text());
  sheetRows = parseCSV(csvText);

  const urls = sheetRows.flatMap(row => extractImageUrls(row[K.img]));
  const selected = urls
    .sort(() => Math.random() - 0.5)
    .slice(0, IMAGE_LOAD_COUNT);

  loadedImages = (await Promise.all(selected.map(loadImage))).filter(Boolean);
  drawRandomBackground();
}

loadSheet();

function drawRandomBackground() {
  const W = bgCanvas.width;
  const H = bgCanvas.height;

  bgCtx.clearRect(0, 0, W, H);
  bgCtx.fillStyle = "white";
  bgCtx.fillRect(0, 0, W, H);

  if (!loadedImages.length) return;

  for (let i = 0; i < IMAGE_COUNT; i++) {
    const img = loadedImages[Math.floor(Math.random() * loadedImages.length)];

    const scale = 0.18 + Math.random() * 0.9;
    const iw = img.width * scale;
    const ih = img.height * scale;

    const x = Math.random() * W;
    const y = Math.random() * H;

    bgCtx.save();
    bgCtx.translate(x, y);
    bgCtx.rotate(Math.random() * Math.PI * 2);

    bgCtx.globalAlpha = 0.14 + Math.random() * 0.36;
    bgCtx.filter = "grayscale(1) contrast(2.4) brightness(0.9)";

    bgCtx.drawImage(img, -iw / 2, -ih / 2, iw, ih);

    bgCtx.restore();
    bgCtx.filter = "none";
  }

  addNoise();
}

function addNoise() {
  const W = bgCanvas.width;
  const H = bgCanvas.height;
  const imgData = bgCtx.getImageData(0, 0, W, H);
  const d = imgData.data;

  for (let i = 0; i < d.length; i += 4) {
    const gray = d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114;
    const noise = (Math.random() - 0.5) * 38;
    const v = Math.max(0, Math.min(255, gray + noise));

    d[i] = v;
    d[i + 1] = v;
    d[i + 2] = v;
  }

  bgCtx.putImageData(imgData, 0, 0);
}

/* 마우스 / 터치 드로잉 */
result.addEventListener("pointerdown", e => {
  if (cameraMode) return;
  if (e.target.closest(".result-name, .plus, .result-detail")) return;

  e.preventDefault();

  drawing = true;
  points = [];

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  addPoint(e);
});

result.addEventListener("pointermove", e => {
  if (cameraMode) return;
  if (!drawing) return;

  e.preventDefault();

  addPoint(e);
  drawLine();
});

result.addEventListener("pointerup", () => {
  if (cameraMode) return;
  if (!drawing) return;

  drawing = false;
  recognizeShape();
});

result.addEventListener("pointercancel", () => {
  if (cameraMode) return;
  if (!drawing) return;

  drawing = false;
  recognizeShape();
});

function addPoint(input, y) {
  if (typeof input === "number") {
    points.push({
      x: input,
      y: y
    });
  } else {
    points.push({
      x: input.clientX,
      y: input.clientY
    });
  }
}

function drawLine() {
  if (points.length < 2) return;

  const a = points[points.length - 2];
  const b = points[points.length - 1];

  ctx.beginPath();
  ctx.moveTo(a.x, a.y);
  ctx.lineTo(b.x, b.y);
  ctx.strokeStyle = cameraMode ? "red" : "black";
  ctx.lineWidth = cameraMode ? 8 : 6;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.stroke();
}

function distance(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

function pathLength() {
  let len = 0;

  for (let i = 1; i < points.length; i++) {
    len += distance(points[i - 1], points[i]);
  }

  return len;
}

function getBounds() {
  let minX = Infinity;
  let maxX = -Infinity;
  let minY = Infinity;
  let maxY = -Infinity;

  points.forEach(p => {
    minX = Math.min(minX, p.x);
    maxX = Math.max(maxX, p.x);
    minY = Math.min(minY, p.y);
    maxY = Math.max(maxY, p.y);
  });

  return {
    minX,
    maxX,
    minY,
    maxY,
    width: maxX - minX,
    height: maxY - minY
  };
}

function recognizeShape() {
  if (points.length < 2) return;

  const start = points[0];
  const end = points[points.length - 1];
  const len = pathLength();
  const closeDist = distance(start, end);
  const box = getBounds();

  const width = box.width;
  const height = box.height;

  let keyword = "";

  if (len < 90 && width < 90 && height < 90) {
    keyword = "구두";
  }

  else if (
    closeDist < 80 &&
    len > 120 &&
    width > 40 &&
    height > 40 &&
    Math.abs(width - height) < 80
  ) {
    keyword = "권표";
  }

  else if (
    width > 70 &&
    len > 70 &&
    closeDist > 70 &&
    height > 12 &&
    height < width * 0.5
  ) {
    const quarter = points[Math.floor(points.length * 0.25)];
    const middle  = points[Math.floor(points.length * 0.5)];
    const threeQ  = points[Math.floor(points.length * 0.75)];

    const curveSpread =
      Math.abs(middle.y - quarter.y) +
      Math.abs(middle.y - threeQ.y);

    if (curveSpread > 10) {
      keyword = "괄호";
    }
  }

  if (keyword) {
    handleResult(keyword);
  } else {
    showList([], "인식 실패");
  }
}

function handleResult(keyword) {
  const filtered = sheetRows.filter(row =>
    (row[K.cat] || "").includes(keyword)
  );

  showList(filtered, keyword);
}

function escapeHTML(str) {
  return String(str || "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function showList(list, keyword) {
  let html = `
    <div class="top-nav">
      <span>(。。。。。。。) ● ○ ◎ ◉ </span>
    </div>
  `;

  if (!list.length) {
    html += `
      <div class="fail">${escapeHTML(keyword)}</div>
      <div class="result-item">
        <div class="result-row">
          <div class="result-name"><span>결과 없음</span></div>
        </div>
      </div>
    `;

    result.innerHTML = html;
    bindResultRows();
    if (!cameraMode) drawRandomBackground();
    return;
  }

  html += `
    <div class="keyword-header">
      <div class="keyword-title">${escapeHTML(keyword)}</div>
      <div class="keyword-info">${list.length} RESULTS</div>
    </div>
  `;

  list.forEach(item => {
    const img = extractImageUrls(item[K.img])[0] || "";

    html += `
      <div class="result-item">
        <div class="result-row">
          <div class="result-name"><span>${escapeHTML(item[K.name])}</span></div>
          <div class="plus">+</div>
        </div>

        <div class="result-detail">
          <div class="detail-inner">
            ${img ? `<img src="${escapeHTML(img)}">` : ""}
            <div class="detail-text">
              <div><b>이름</b> ${escapeHTML(item[K.name])}</div>
              <div><b>분류</b> ${escapeHTML(item[K.cat])}</div>
              <div><b>시대</b> ${escapeHTML(item[K.period])}</div>
              <div><b>종이</b> ${escapeHTML(item[K.paper])}</div>
              <div><b>크기</b> ${escapeHTML(item[K.size])}</div>
              <div><b>소장처</b> ${escapeHTML(item[K.coll])}</div>
            </div>
          </div>
        </div>
      </div>
    `;
  });

  result.innerHTML = html;
  bindResultRows();
  if (!cameraMode) drawRandomBackground();
}

function bindResultRows() {
  document.querySelectorAll(".result-name, .plus").forEach(el => {
    el.addEventListener("click", e => {
      e.stopPropagation();
      el.closest(".result-item").classList.toggle("open");
    });
  });
}

/* 카메라 손끝 드로잉 */
cameraBtn.addEventListener("click", async () => {
  cameraMode = !cameraMode;
  document.body.classList.toggle("camera-mode", cameraMode);

  if (cameraMode) {
    cameraBtn.textContent = "MOUSE DRAW";
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    points = [];
    drawing = false;

    if (!cameraReady) {
      await setupCamera();
      await setupHandTracking();
      cameraReady = true;
      requestAnimationFrame(cameraLoop);
    }
  } else {
    cameraBtn.textContent = "CAMERA DRAW";
    drawing = false;
    points = [];
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawRandomBackground();
  }
});

async function setupCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: {
      facingMode: "user",
      width: 1280,
      height: 720
    },
    audio: false
  });

  video.srcObject = stream;

  return new Promise(resolve => {
    video.onloadedmetadata = () => resolve();
  });
}

async function setupHandTracking() {
  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm"
  );

  handLandmarker = await HandLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath:
        "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/latest/hand_landmarker.task",
      delegate: "GPU"
    },
    runningMode: "VIDEO",
    numHands: 1
  });
}

function cameraLoop() {
  if (cameraMode && handLandmarker && video.readyState >= 2) {
    if (video.currentTime !== lastVideoTime) {
      lastVideoTime = video.currentTime;

      const handResult = handLandmarker.detectForVideo(
        video,
        performance.now()
      );

      handleCameraHand(handResult);
    }
  }

  requestAnimationFrame(cameraLoop);
}

function handleCameraHand(handResult) {
  if (!handResult.landmarks || handResult.landmarks.length === 0) {
    if (drawing) finishCameraDrawing();
    return;
  }

  const hand = handResult.landmarks[0];

  const indexTip = hand[8];
  const thumbTip = hand[4];

  const x = (1 - indexTip.x) * canvas.width;
  const y = indexTip.y * canvas.height;

  const thumbX = (1 - thumbTip.x) * canvas.width;
  const thumbY = thumbTip.y * canvas.height;

  const pinchDistance = Math.hypot(x - thumbX, y - thumbY);
  const isPinching = pinchDistance < 55;

  drawCameraCursor(x, y, isPinching);

  if (isPinching) {
    if (!drawing) {
      drawing = true;
      points = [];
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      addPoint(x, y);
    } else {
      addPoint(x, y);
      drawLine();
    }
  } else {
    if (drawing) {
      finishCameraDrawing();
    }
  }
}

function finishCameraDrawing() {
  drawing = false;
  recognizeShape();
}

function drawCameraCursor(x, y, active) {
  if (drawing) return;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.beginPath();
  ctx.arc(x, y, active ? 14 : 9, 0, Math.PI * 2);
  ctx.fillStyle = active ? "red" : "white";
  ctx.strokeStyle = "black";
  ctx.lineWidth = 3;
  ctx.fill();
  ctx.stroke();
}
</script>

</body>
</html>
